# Three MinIO instances as the shards of the authoritative store. Each is
# its own endpoint, so no single S3 endpoint carries every read, and each
# exposes Prometheus metrics without auth so the e2e can count the GETs the
# store itself served.
apiVersion: v1
kind: Namespace
metadata:
  name: c4-store
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio-0, namespace: c4-store}
spec:
  replicas: 1
  selector: {matchLabels: {app: minio, shard: "0"}}
  template:
    metadata: {labels: {app: minio, shard: "0"}}
    spec:
      nodeSelector: {kubernetes.io/hostname: c4-operator-e2e-control-plane}
      tolerations: [{operator: Exists}]
      containers:
      - name: minio
        image: minio/minio:latest
        imagePullPolicy: IfNotPresent
        args: [server, /data]
        env:
        - {name: MINIO_ROOT_USER, value: c4e2eaccess}
        - {name: MINIO_ROOT_PASSWORD, value: c4e2esecretkey}
        - {name: MINIO_PROMETHEUS_AUTH_TYPE, value: public}
        ports: [{containerPort: 9000}]
        readinessProbe: {httpGet: {path: /minio/health/ready, port: 9000}}
        volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: minio-0, namespace: c4-store}
spec:
  type: NodePort
  selector: {app: minio, shard: "0"}
  ports: [{port: 9000, targetPort: 9000, nodePort: 30900}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio-1, namespace: c4-store}
spec:
  replicas: 1
  selector: {matchLabels: {app: minio, shard: "1"}}
  template:
    metadata: {labels: {app: minio, shard: "1"}}
    spec:
      nodeSelector: {kubernetes.io/hostname: c4-operator-e2e-control-plane}
      tolerations: [{operator: Exists}]
      containers:
      - name: minio
        image: minio/minio:latest
        imagePullPolicy: IfNotPresent
        args: [server, /data]
        env:
        - {name: MINIO_ROOT_USER, value: c4e2eaccess}
        - {name: MINIO_ROOT_PASSWORD, value: c4e2esecretkey}
        - {name: MINIO_PROMETHEUS_AUTH_TYPE, value: public}
        ports: [{containerPort: 9000}]
        readinessProbe: {httpGet: {path: /minio/health/ready, port: 9000}}
        volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: minio-1, namespace: c4-store}
spec:
  type: NodePort
  selector: {app: minio, shard: "1"}
  ports: [{port: 9000, targetPort: 9000, nodePort: 30901}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio-2, namespace: c4-store}
spec:
  replicas: 1
  selector: {matchLabels: {app: minio, shard: "2"}}
  template:
    metadata: {labels: {app: minio, shard: "2"}}
    spec:
      nodeSelector: {kubernetes.io/hostname: c4-operator-e2e-control-plane}
      tolerations: [{operator: Exists}]
