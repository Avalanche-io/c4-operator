# A context tool: one the submission design's examples name. Written for the fixtures.
c4: tool/1
name: pyro-sim
title: Pyro sim
summary: A pyro simulation cached to VDB, one frame after another.
kind: frames
runs:
  image: registry.petrelfinch.example/houdini:21.0.440
  command: [hython, "{{Tool.Dir}}/sim.py", "{{Param.seed}}", "{{Param.dissipation}}"]
frames: {chunk: 1, order: sequential}
params:
- {name: seed, type: INT, default: 1}
- {name: dissipation, type: FLOAT, default: 0.1, minValue: 0, maxValue: 1}
writes: [sim/]
needs: {cpu: 16, memory: 64G, licences: {sesi/hbatch: 1}, network: [licences]}
