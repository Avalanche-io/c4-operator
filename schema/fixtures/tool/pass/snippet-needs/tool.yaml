# The tool format design's example, section 2.6, wrapped in the smallest whole tool. Keep in step with it.
c4: tool/1
name: snippet-needs
kind: frames
runs:
  image: c4/runtime-base
  command: [bash, "{{Tool.Dir}}/run.sh"]
needs:
  cpu: 8
  memory: 64G
  gpu: 1
  gpuMemory: 24G
  scratch: 50G
  licences: {sesi/karma: 1}     # LicensePool sesi, feature karma, one seat per unit
  network: [licences]           # what it may reach: nothing by default
  farm: job                     # what it may do on the farm itself: read, job or project
  sizes:                        # named sizes a submission may choose
    heavy: {memory: 128G, gpuMemory: 48G}
