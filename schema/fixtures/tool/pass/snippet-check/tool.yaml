# The tool format design's example, section 2.9, wrapped in the smallest whole tool. Keep in step with it.
c4: tool/1
name: snippet-check
runs:
  image: c4/runtime-base
  command: [bash, "{{Tool.Dir}}/run.sh"]
kind: check
judges: frames            # frames | units | outputs
rework: {maxPasses: 2, onExhausted: escalate}
