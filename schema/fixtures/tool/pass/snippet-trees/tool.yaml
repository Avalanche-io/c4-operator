# The tool format design's example, section 2.5, wrapped in the smallest whole tool. Keep in step with it.
c4: tool/1
name: snippet-trees
kind: frames
runs:
  image: c4/runtime-base
  command: [bash, "{{Tool.Dir}}/run.sh"]
writes: [render/]                       # where it writes; anything else it writes is reported
previews: "render/*.$F4.exr"            # frames the HUD's player shows (made into PNGs for it)
