# The tool format design's example, section 2.3, wrapped in the smallest whole tool. Keep in step with it.
c4: tool/1
name: snippet-runs
kind: frames
params:
- {name: stage, type: PATH, objectType: FILE, dataFlow: IN}
runs:
  image: registry.petrelfinch.example/houdini:21.0.440   # a container runner
  host:                                                  # and/or a host runner
    has: [houdini-21.0]
    exe: {linux: /opt/hfs21.0/bin/husk, windows: "C:/Program Files/Side Effects Software/Houdini 21.0.440/bin/husk.exe"}
  exe: husk                                              # the program, in the image
  command: ["{{Run.Exe}}", -V, 2a, -f, "{{Unit.FrameStart}}", -n, "{{Unit.FrameCount}}", "{{Param.stage}}"]
  env: {HOUDINI_PATHMAP: "{{Run.PathMap.houdini}}"}
  workdir: "{{Job.Tree}}"
