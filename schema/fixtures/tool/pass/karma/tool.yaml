# The tool format design's example, section 7.2. Keep in step with it.
c4: tool/1
name: karma
title: Karma render
summary: Renders a USD stage's render settings with Karma XPU or CPU to OpenEXR.
owner: lighting-td@petrelfinch.example
kind: frames
runs:
  image: registry.petrelfinch.example/houdini:21.0.440      # built from onboarding's houdini.Dockerfile
  exe: husk
  host:
    has: [houdini-21.0]
    exe: {windows: "C:/Program Files/Side Effects Software/Houdini 21.0.440/bin/husk.exe"}
  command:
  - "{{Run.Exe}}"
  - --renderer
  - "{{Param.renderer}}"
  - --settings
  - "{{Param.settings}}"
  - -f
  - "{{Unit.FrameStart}}"
  - -n
  - "{{Unit.FrameCount}}"
  - -V
  - 2a
  - "{{Param.stage}}"
  env: {HOUDINI_PATHMAP: "{{Run.PathMap}}"}
frames: {chunk: 1, order: binary}
params:
- name: stage
  type: PATH
  objectType: FILE
  dataFlow: IN
  from: scene.file
  userInterface: {control: CHOOSE_INPUT_FILE, label: USD stage, fileFilters: [{label: USD, patterns: ["*.usd", "*.usda", "*.usdc"]}]}
- name: settings
  type: STRING
  default: /Render/rendersettings
  from: scene.renderables
  userInterface: {label: Render settings}
- name: renderer
  type: STRING
  default: BRAY_HdKarmaXPU
  allowedValues: [BRAY_HdKarmaXPU, BRAY_HdKarma]
  userInterface: {control: DROPDOWN_LIST, label: Engine}
writes: [render/]
previews: "render/**/*.$F4.exr"
needs:
  cpu: 8
  memory: 64G
  gpu: 1
  gpuMemory: 24G
  licences: {sesi/karma: 1}
  network: [licences]
  sizes:
    heavy: {memory: 128G, gpuMemory: 48G}
progress:
- {match: 'ALF_PROGRESS (\d+)%', percent: 1}
errors:
  licence:   ['No licenses could be found to run this application']
  permanent: ['Unable to open stage', 'No RenderSettings prim']
  retry:     ['CUDA error', 'OptiX error']
stall: {quietMinutes: 45}
retries: 2
reuse: exact
test:
  tree: test/
  frames: 1
  with: {stage: cube.usda, settings: /Render/rendersettings, renderer: BRAY_HdKarma}
  expect: [render/cube.0001.exr]
