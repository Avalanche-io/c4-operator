# A context tool: one the submission design's examples name. Written for the fixtures.
c4: tool/1
name: port-lead
title: Port lead
summary: An agent that knows the plan and the spec, and answers the builders' questions.
kind: agent
runs:
  image: ghcr.io/avalanche-io/c4-operator/block
  command: [c4-agent, block-pod]
params:
- {name: model, type: STRING, default: claude-opus-5-5}
- {name: effort, type: STRING, default: high, allowedValues: [low, medium, high, xhigh, max]}
needs: {cpu: 2, memory: 4G, network: [model-api]}
