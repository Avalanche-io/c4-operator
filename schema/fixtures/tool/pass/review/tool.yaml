# A context tool: one the submission design's examples name. Written for the fixtures.
c4: tool/1
name: review
title: Idiom review
summary: An agent reviews a ported module for idiom, and passes or sends it back.
kind: agent
runs:
  image: ghcr.io/avalanche-io/c4-operator/block
  command: [c4-agent, block-pod]
params:
- {name: model, type: STRING, default: claude-sonnet-5-5}
- {name: effort, type: STRING, default: medium, allowedValues: [low, medium, high, xhigh, max]}
needs: {cpu: 2, memory: 4G, network: [model-api], farm: job}
