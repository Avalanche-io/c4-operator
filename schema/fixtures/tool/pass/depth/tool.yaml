# The tool format design's example, section 7.3. Keep in step with it.
c4: tool/1
name: depth
title: Depth maps
summary: A depth pass for every frame of a plate sequence, from a monocular depth model.
owner: comp-td@petrelfinch.example
kind: frames
runs:
  image: c4/runtime-torch
  command: [python3, "{{Tool.Dir}}/depth.py"]
frames: {chunk: 4, order: binary}
params:
- name: plates
  type: PATH
  objectType: FILE
  dataFlow: IN
  from: scene.selection
  userInterface: {control: CHOOSE_INPUT_FILE, label: Plates}
- name: model
  type: STRING
  default: depth-anything-v2-small
  allowedValues: [depth-anything-v2-small, depth-anything-v2-base]
  userInterface: {control: DROPDOWN_LIST, label: Model}
- name: colorspace
  type: STRING
  default: ACES2065-1
  allowedValues: [ACES2065-1, ACEScg]
  show: advanced
writes: [depth/]
previews: "depth/*.$F4.exr"
needs:
  cpu: 4
  memory: 16G
  gpu: 1
  sizes:
    cpu-only: {gpu: 0, memory: 24G}
aiUsage:
  model: "{{Param.model}}"
  task: depth
  oversight: comp artist reviews the pass before it is used
stall: {quietMinutes: 20}
reuse: exact
test:
  tree: test/
  frames: 1001-1001
  with: {plates: plates/test.$F4.exr}
  expect: [depth/test.1001.exr]
