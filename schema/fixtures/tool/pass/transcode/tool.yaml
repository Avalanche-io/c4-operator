# A context tool: one the submission design's examples name. Written for the fixtures.
c4: tool/1
name: transcode
title: Review movie
summary: An ACES transcode of the job's frames to a review movie, with a slate.
kind: once
runs:
  image: c4/runtime-media
  command: [bash, "{{Tool.Dir}}/transcode.sh", "{{Param.codec}}", "{{Param.view}}", "{{Param.slate}}"]
params:
- {name: codec, type: STRING, default: prores-422hq, allowedValues: [prores-422hq, prores-4444, dnxhr-hqx], userInterface: {control: DROPDOWN_LIST, label: Codec}}
- {name: view, type: STRING, default: "ACES 1.0 - SDR Video", userInterface: {label: OCIO view}}
- {name: slate, type: BOOL, default: true, userInterface: {control: CHECK_BOX, label: Slate}}
writes: [movie/]
needs: {cpu: 4, memory: 8G}
reuse: exact
