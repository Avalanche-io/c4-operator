# A context tool: one the submission design's examples name. Written for the fixtures.
c4: tool/1
name: usd-passes
title: Passes from the stage
summary: Per frame, exports the stage and emits a karma unit for each render pass it declares.
kind: generator
emits: [karma]
runs:
  image: registry.petrelfinch.example/houdini:21.0.440
  command: [hython, "{{Tool.Dir}}/passes.py", "{{Param.stage}}"]
frames: {chunk: 1, order: binary}
params:
- {name: stage, type: PATH, objectType: FILE, dataFlow: IN, from: scene.file, userInterface: {control: CHOOSE_INPUT_FILE, label: USD stage}}
needs: {cpu: 2, memory: 8G}
