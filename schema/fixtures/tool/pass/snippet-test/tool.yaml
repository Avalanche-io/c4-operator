# The tool format design's example, section 2.10, wrapped in the smallest whole tool. Keep in step with it.
c4: tool/1
name: snippet-test
kind: frames
runs:
  image: c4/runtime-base
  command: [bash, "{{Tool.Dir}}/run.sh"]
params:
- {name: plates, type: PATH, objectType: FILE, dataFlow: IN}
test:
  tree: test/
  frames: 1001-1002
  with: {plates: plates/test.$F4.exr}
  expect: [proxy/test.1001.jpg, proxy/test.1002.jpg]
