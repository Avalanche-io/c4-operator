# A context tool: one the submission design's examples name. Written for the fixtures.
c4: tool/1
name: exr-qc
title: Frame QC
summary: Reads frames and writes a verdict on black frames, NaNs, flicker and missing AOVs.
kind: check
judges: frames
rework: {maxPasses: 2, onExhausted: escalate}
runs:
  image: c4/runtime-oiio
  command: [python3, "{{Tool.Dir}}/qc.py"]
params:
- {name: black, type: BOOL, default: true}
- {name: nan, type: BOOL, default: true}
- {name: flicker, type: BOOL, default: false}
- {name: aovs, type: BOOL, default: false}
needs: {cpu: 2, memory: 4G}
reuse: exact
