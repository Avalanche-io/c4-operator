c4: tool/1
name: usd
title: Flatten and check a USD stage
summary: Flattens a USD stage and its layers into one layer, and checks it with usdchecker.
kind: once
runs:
  image: c4/job-usd
  command: [bash, "{{Tool.Dir}}/usd.sh", "{{Param.stage}}", "{{Param.validate}}"]
params:
- name: stage
  type: PATH
  objectType: FILE
  dataFlow: IN
  description: The USD stage to flatten, with its sublayers and references.
  show: artist
  from: scene.file
  userInterface: {control: CHOOSE_INPUT_FILE, label: USD stage, fileFilters: [{label: USD, patterns: ["*.usd", "*.usda", "*.usdc"]}]}
- name: validate
  type: BOOL
  default: true
  description: Check the flattened layer with usdchecker, keep its report in flat/usdchecker.txt, and fail the job if it finds a problem.
  show: advanced
  userInterface: {control: CHECK_BOX, label: Check with usdchecker}
writes: [flat/]
errors:
  permanent: ['Failed to open layer']
reuse: exact
test:
  tree: test/
  with: {stage: shot/test.usda}
  expect: [flat/test.flat.usda, flat/usdchecker.txt]
