c4: tool/1
name: transcode
title: Review movie
summary: An ACES-managed review movie of a plate or render sequence (ProRes 422 HQ, ProRes 4444 or DNxHR HQX) and a contact sheet.
kind: once
runs:
  image: c4/job-media
  command: [bash, "{{Tool.Dir}}/transcode.sh", "{{Param.plates}}", "{{Param.range}}", "{{Param.codec}}", "{{Param.fps}}", "{{Job.Shot}}"]
params:
- name: plates
  type: PATH
  objectType: FILE
  dataFlow: IN
  description: The ACES2065-1 OpenEXR sequence, with $F4 where the frame number goes, as plates/sm0140/sm0140.$F4.exr. A folder of <name>.####.exr frames, or one frame's file, also works.
  show: artist
  from: scene.selection
  userInterface: {control: CHOOSE_INPUT_FILE, label: Frames to review, fileFilters: [{label: EXR, patterns: ["*.exr"]}]}
- name: range
  type: RANGE_EXPR
  description: The frames in the movie, first to last, as 1001-1048.
  show: artist
  from: shot.frames
  userInterface: {control: LINE_EDIT, label: Frames}
- name: codec
  type: STRING
  default: prores-422hq
  allowedValues: [prores-422hq, prores-4444, dnxhr-hqx]
  description: The movie's codec. ProRes 4444 keeps an alpha channel.
  show: artist
  userInterface: {control: DROPDOWN_LIST, label: Codec}
- name: fps
  type: STRING
  default: "24"
  allowedValues: ["23.976", "24", "25", "29.97", "30", "48", "50", "59.94", "60"]
  description: The movie's frame rate.
  show: advanced
  userInterface: {control: DROPDOWN_LIST, label: Frame rate}
writes: [review/]
needs: {scratch: 4G}
reuse: exact
test:
  tree: test/
  with: {plates: plates/test/test.$F4.exr, range: 1001-1002}
  expect: [review/test_review.mov, review/test_contact.jpg]
