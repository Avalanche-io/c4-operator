name: release

# A pushed tag vX.Y.Z builds the release: the CLI for Linux and macOS, the
# multi-arch image ghcr.io/avalanche-io/c4-operator:vX.Y.Z, install.yaml,
# checksums, Homebrew formulas, the job images, the sample set, and a draft
# GitHub release to review and publish by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - run: make tools
    - run: make test

  # The job images (the prebuilt tools run in them), each architecture on a
  # runner of its own, natively: OpenUSD's compile under emulation would
  # outlast a job's time limit. Each pushes <name>:<tag>-<arch>.
  images:
    needs: test
    strategy:
      matrix:
        include:
        - {arch: amd64, runner: ubuntu-latest}
        - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - run: make job-images runtime-images PUSH=1 PLATFORMS=linux/${{ matrix.arch }} VERSION=${{ github.ref_name }} TAG_SUFFIX=-${{ matrix.arch }}

  # One multi-arch tag per image, from the two above.
  manifests:
    needs: images
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - run: |
        tag=${{ github.ref_name }}
        for img in $(make -s job-image-names | tr ' ' '\n' | sed 's#^#c4-job-#') \
                   $(make -s runtime-image-names | tr ' ' '\n' | sed 's#^#c4-runtime-#'); do
          img=ghcr.io/avalanche-io/$img
          docker buildx imagetools create -t "$img:$tag" "$img:$tag-amd64" "$img:$tag-arm64"
        done

  # The prebuilt tools' own tests against the images just joined, each as a
  # unit runs (in Docker, unprivileged, no network): a tool that fails its
  # test stops the release, and the tools a release ships are tested in it.
  tool-tests:
    needs: manifests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - run: make tool-tests VERSION=${{ github.ref_name }}

  # The CLIs, the operator image, the manifests and the formulas. The
  # prebuilt tools' tool.lock files are written first, pinning the images
  # above, so c4-farm embeds the tools exactly as c4 farm up publishes them.
  release:
    needs: [manifests, tool-tests]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - run: make tools
    - run: make tool-locks VERSION=${{ github.ref_name }}
    # the Mac's c4-farm embeds the same locks (mac-cli)
    - uses: actions/upload-artifact@v7
      with:
        name: tool-locks
        path: tools/*/tool.lock
    # the tools tool-tests ran, which c4-farm and the operator name as
    # tested in this release
    - run: echo "C4_TESTED_TOOLS=$(make -s tested-tools)" >> "$GITHUB_ENV"
    - uses: goreleaser/goreleaser-action@v7
      with:
        version: "~> v2"
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # c4-farm for macOS: built on a Mac, with cgo and the Secure Enclave's
  # Swift library (internal/keystore, make c4-farm-mac), for macOS 13 and
  # later, both architectures; GoReleaser builds the rest with cgo off. It
  # embeds the release job's tool locks, and its archives join the draft
  # release named as GoReleaser names the others, with their lines added
  # to checksums.txt.
  mac-cli:
    needs: release
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - uses: actions/download-artifact@v8
      with:
        name: tool-locks
        path: tools
    # The keystore's Secure Enclave tests skip on hosted runners, which have
    # no Secure Enclave: this builds and links it, and its key files and
    # wiring are tested; the Secure Enclave path itself is tested only by a
    # run on a Mac that has one (make test-keystore-se there, unlocked).
    - run: make test-keystore-se
    - run: |
        tag=${{ github.ref_name }}
        ver=${tag#v}
        mkdir -p dist/mac
        for arch in arm64 amd64; do
          GOARCH=$arch make c4-farm-mac VERSION=$tag
          out=dist/mac/c4-farm_${ver}_darwin_${arch}
          mkdir -p "$out/skills/c4-farm"
          cp bin/c4-farm LICENSE NOTICE "$out/"
          cp skills/c4-farm/* "$out/skills/c4-farm/"
          tar -C "$out" -czf "$out.tar.gz" .
        done
        cd dist/mac
        gh release download "$tag" -p checksums.txt --clobber
        # a rerun replaces this job's lines rather than adding a second hash
        grep -v "  c4-farm_${ver}_darwin_" checksums.txt > checksums.new || true
        shasum -a 256 c4-farm_${ver}_darwin_*.tar.gz >> checksums.new
        mv checksums.new checksums.txt
        gh release upload "$tag" c4-farm_${ver}_darwin_*.tar.gz checksums.txt --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The sample set `c4 farm samples get` downloads, built with this release's
  # images, attached to the draft release with its C4 ID beside it.
  samples:
    needs: release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - run: |
        go install github.com/Avalanche-io/c4/cmd/c4
        python3 -m pip install --user "OpenImageIO==3.2.1.3"
        echo "$HOME/go/bin" >>"$GITHUB_PATH"
        echo "$HOME/.local/bin" >>"$GITHUB_PATH"
    - run: hack/samples/build.sh ${{ github.ref_name }} bin/samples
    - run: gh release upload ${{ github.ref_name }} bin/samples/c4-samples-${{ github.ref_name }}.tar.gz bin/samples/c4-samples-${{ github.ref_name }}.tar.gz.c4 --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
