name: release

# A pushed tag vX.Y.Z builds the release: the CLI for Linux and macOS, the
# multi-arch image ghcr.io/avalanche-io/c4-operator:vX.Y.Z, install.yaml,
# checksums, Homebrew formulas, the job images, the sample set, and a draft
# GitHub release to review and publish by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - run: make tools
    - run: make test
    - uses: goreleaser/goreleaser-action@v7
      with:
        version: "~> v2"
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # a token that can write to Avalanche-io/homebrew-tap, for the formulas
        HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # The job images (the prebuilt tools run in them), each architecture on a
  # runner of its own, natively: OpenUSD's compile under emulation would
  # outlast a job's time limit. Each pushes <name>:<tag>-<arch>.
  images:
    needs: release
    strategy:
      matrix:
        include:
        - {arch: amd64, runner: ubuntu-latest}
        - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - run: make job-images PUSH=1 PLATFORMS=linux/${{ matrix.arch }} VERSION=${{ github.ref_name }} TAG_SUFFIX=-${{ matrix.arch }}

  # One multi-arch tag per image, from the two above.
  manifests:
    needs: images
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - run: |
        tag=${{ github.ref_name }}
        for i in $(make -s job-image-names); do
          img=ghcr.io/avalanche-io/c4-job-$i
          docker buildx imagetools create -t "$img:$tag" "$img:$tag-amd64" "$img:$tag-arm64"
        done

  # The sample set `c4 farm samples get` downloads, built with this release's
  # images, attached to the draft release with its C4 ID beside it.
  samples:
    needs: manifests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - run: |
        go install github.com/Avalanche-io/c4/cmd/c4
        python3 -m pip install --user "OpenImageIO==3.2.1.3"
        echo "$HOME/go/bin" >>"$GITHUB_PATH"
        echo "$HOME/.local/bin" >>"$GITHUB_PATH"
    - run: hack/samples/build.sh ${{ github.ref_name }} bin/samples
    - run: gh release upload ${{ github.ref_name }} bin/samples/c4-samples-${{ github.ref_name }}.tar.gz bin/samples/c4-samples-${{ github.ref_name }}.tar.gz.c4 --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
