name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: gofmt, vet, generated code, manifests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - run: make tools
    - run: make verify

  test:
    # Both architectures, so a bug that shows on one only (an int
    # conversion of +Inf, an alignment) fails here, not on a laptop.
    name: unit and envtest (linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - {arch: amd64, runner: ubuntu-latest}
        - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - run: make tools
    # The controllers and the queue run against a real API server and etcd
    # (envtest); setup-envtest downloads them.
    - run: make test
    # A bundle written on one machine replays to the same decisions here.
    - name: a diagnostic bundle replays
      run: go run ./hack/sim -bundle hack/sim/testdata/gpu-tight.tgz -replay decide
    - name: cache tiers under the race detector
      run: go test -race -count=1 ./internal/tier/... ./internal/fill/... ./internal/objcache/...

  linux-privileged:
    name: overlay, layers and capture (privileged container)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    # Overlay mounts, whiteouts and capture need root: the test binaries run
    # in a privileged container on a Docker volume.
    - run: make test-linux ARCH=amd64

  build:
    name: binaries and the release config
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - uses: goreleaser/goreleaser-action@v7
      with:
        version: "~> v2"
        args: build --snapshot --clean

  mlflow-plugin:
    name: mlflow-c4 plugins (Python, with a local MLflow server)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - run: pip install -e 'integrations/mlflow-c4[test]'
    - run: python -m pytest integrations/mlflow-c4
      env:
        MLFLOW_DISABLE_AGENT_HINT: "1"

  dcc-submitters:
    name: DCC submitters (c4submit and the panels, against fakes of each application)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is the oldest a supported DCC embeds (Nuke 14); 3.11 is Houdini 20.5 and 21, Maya 2025, Blender 4.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - run: pip install pytest pyyaml
    - run: python -m pytest integrations/dcc
