name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: gofmt, vet, generated code, manifests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - run: make tools
    - run: make verify

  test:
    # Both architectures, so a bug that shows on one only (an int
    # conversion of +Inf, an alignment) fails here, not on a laptop.
    name: unit and envtest (linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - {arch: amd64, runner: ubuntu-latest}
        - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - run: make tools
    # The c4 CLI of the suite release, checksum checked, so the tests that
    # read chains with it (TestChainsReadByC4CLI) run here, not skip. On
    # both legs: the skip allow-list is per GOOS, not per architecture.
    - name: c4 CLI 1.0.25
      env:
        ARCH: ${{ matrix.arch }}
      run: |
        case "$ARCH" in
          amd64) sum=38566171f6f38ed2287b0bedf69c47393fdfae978bdfa0e932530731f1bc0393 ;;
          arm64) sum=cdaf75941f711af8ba099d495fec92cad26ca2d61773629e72c33a59c67e70b0 ;;
        esac
        f=c4_v1.0.25_linux_$ARCH.tar.gz
        curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/Avalanche-io/c4toolkit/releases/download/v1.0.25/$f"
        echo "$sum  $RUNNER_TEMP/$f" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$RUNNER_TEMP/c4_v1.0.25_linux_$ARCH/c4" "$HOME/.local/bin/c4"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    # The controllers and the queue run against a real API server and etcd
    # (envtest); setup-envtest downloads them. Every skip is reported, and
    # one hack/skips/allowed.txt does not name fails the job.
    - run: make test
    # A bundle written on one machine replays to the same decisions here.
    - name: a diagnostic bundle replays
      run: go run ./hack/sim -bundle hack/sim/testdata/gpu-tight.tgz -replay decide
    - name: cache tiers, views, imports, the queue and capture under the race detector
      run: make test-race

  # c4-farm for macOS, with the Secure Enclave's Swift library: it builds for
  # both architectures, and the keystore's tests run. A hosted Mac runner
  # has no Secure Enclave, so its tests of the chip itself skip there; they
  # run on a developer's Mac (make test-keystore-se).
  # The Secure Enclave tests skip here (a hosted runner has none): this
  # builds and links the keystore's Swift library for both architectures.
  macos-keystore:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - run: make test-keystore-se
    - run: GOARCH=arm64 make c4-farm-mac && GOARCH=amd64 make c4-farm-mac
    # What runs only on macOS: APFS clone workspaces (checkout), capture
    # and the object cache on APFS. Skips are held to the allow-list.
    - name: checkout, capture and the object cache on APFS
      run: go test -json -count=1 ./internal/checkout/... ./internal/capture/... ./internal/objcache/... | go run ./hack/skips -allow hack/skips/allowed.txt

  linux-privileged:
    name: overlay, layers and capture (privileged container)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    # Overlay mounts, whiteouts and capture need root: the test binaries run
    # in a privileged container on a Docker volume.
    - run: make test-linux ARCH=amd64

  build:
    name: binaries and the release config
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - uses: goreleaser/goreleaser-action@v7
      with:
        version: "~> v2"
        args: build --snapshot --clean

  mlflow-plugin:
    name: mlflow-c4 plugins (Python, with a local MLflow server)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - run: pip install -e 'integrations/mlflow-c4[test]'
    - run: python -m pytest integrations/mlflow-c4
      env:
        MLFLOW_DISABLE_AGENT_HINT: "1"

  dcc-submitters:
    name: DCC submitters (c4submit and the panels, against fakes of each application)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is the oldest a supported DCC embeds (Nuke 14); 3.11 is Houdini 20.5 and 21, Maya 2025, Blender 4.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - run: pip install pytest pyyaml
    - run: python -m pytest integrations/dcc
