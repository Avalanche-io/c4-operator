# Releases are cut by pushing a tag (vX.Y.Z); .github/workflows/release.yaml
# runs GoReleaser, which builds the CLIs (c4-operator and c4-agent, the host
# runner, for Linux and macOS; c4-farm for Linux, macOS and Windows; c4-sync,
# the tracker sync, experimental, for Linux and macOS), the multi-arch images
# on GHCR, the install manifests, and a draft GitHub release to review
# before publishing. `make release-snapshot` runs the same locally and
# publishes nothing.
version: 2
project_name: c4-operator

before:
  hooks:
  - go mod verify
  - make install-yaml VERSION={{ .Tag }}
  - make sync-yaml VERSION={{ .Tag }}

builds:
- id: c4-operator
  main: ./cmd/c4-operator
  binary: c4-operator
  env: [CGO_ENABLED=0]
  goos: [linux, darwin]
  goarch: [amd64, arm64]
  flags: [-trimpath]
  # the tools whose own tests the release ran (make tested-tools), which
  # the HUD books as tested in it
  ldflags: ["-s -w -X main.version={{ .Tag }} -X github.com/Avalanche-io/c4-operator/tools.tested={{ envOrDefault \"C4_TESTED_TOOLS\" \"\" }}"]

- id: c4-farm
  main: ./cmd/c4-farm
  binary: c4-farm
  env: [CGO_ENABLED=0]
  goos: [linux, darwin, windows]
  goarch: [amd64, arm64]
  flags: [-trimpath]
  ldflags: ["-s -w -X main.version={{ .Tag }}"]

- id: c4-agent
  main: ./cmd/c4-agent
  binary: c4-agent
  env: [CGO_ENABLED=0]
  goos: [linux, darwin]
  goarch: [amd64, arm64]
  flags: [-trimpath]
  ldflags: ["-s -w"]

- id: c4-sync
  main: ./cmd/c4-sync
  binary: c4-sync
  env: [CGO_ENABLED=0]
  goos: [linux, darwin]
  goarch: [amd64, arm64]
  flags: [-trimpath]
  ldflags: ["-s -w -X main.version={{ .Tag }}"]

# The local farm's stand-in GitHub (c4 farm up --tracker), in c4-sync's
# image beside it; linux only, and in no archive.
- id: c4-sandbox-github
  main: ./cmd/c4-sandbox-github
  binary: c4-sandbox-github
  env: [CGO_ENABLED=0]
  goos: [linux]
  goarch: [amd64, arm64]
  flags: [-trimpath]
  ldflags: ["-s -w"]

- id: c4-unit
  main: ./cmd/c4-unit
  binary: c4-unit
  env: [CGO_ENABLED=0]
  # linux for units in pods; macOS and Windows for host runners
  goos: [linux, darwin, windows]
  goarch: [amd64, arm64]
  flags: [-trimpath]
  ldflags: ["-s -w"]

# c4-unit again, for the platforms c4-agent runs on, to go in its archive
- id: c4-unit-host
  main: ./cmd/c4-unit
  binary: c4-unit
  env: [CGO_ENABLED=0]
  goos: [linux, darwin]
  goarch: [amd64, arm64]
  flags: [-trimpath]
  ldflags: ["-s -w"]

archives:
# c4-agent's archive carries c4-unit too: a host runner runs its units with it
- id: c4-agent
  ids: [c4-agent, c4-unit-host]
  formats: [tar.gz]
  name_template: "c4-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  files: [LICENSE, NOTICE]
- id: c4-unit
  ids: [c4-unit]
  formats: [tar.gz]
  format_overrides: [{goos: windows, formats: [zip]}]
  name_template: "c4-unit_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  files: [LICENSE, NOTICE, cmd/c4-unit/c4unit.py]
- id: c4-farm
  ids: [c4-farm]
  formats: [tar.gz]
  format_overrides: [{goos: windows, formats: [zip]}]
  name_template: "c4-farm_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  files: [LICENSE, NOTICE, skills/c4-farm/*]
- id: c4-sync
  ids: [c4-sync]
  formats: [tar.gz]
  name_template: "c4-sync_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  files: [LICENSE, NOTICE, docs/c4-sync.md]
- id: c4-operator
  ids: [c4-operator]
  formats: [tar.gz]
  name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  files: [LICENSE, NOTICE, README.md]

# Homebrew formulas for mrjoshuak/homebrew-tap, for macOS and Linux:
# `brew install mrjoshuak/tap/c4-farm` (and c4-agent, the host runner).
# Formulas rather than casks, which are macOS only. The release never pushes
# them: the C4 lead writes the tap's c4-farm.rb and c4-agent.rb from the
# release's checksums (c4toolkit scripts/farm-formulas.sh), so these are
# generated into dist/homebrew only, as the reference they are checked
# against.
brews:
- name: c4-farm
  ids: [c4-farm]
  repository:
    owner: mrjoshuak
    name: homebrew-tap
    token: "{{ envOrDefault \"HOMEBREW_TAP_TOKEN\" \"\" }}"
  directory: Formula
  homepage: https://github.com/Avalanche-io/c4-operator
  description: Submit work to a C4 farm, watch it and take its output home; c4 farm up makes a farm on this machine
  license: Apache-2.0
  skip_upload: true
  # one brew install (c4, which depends on this formula) brings c4 farm,
  # c4-agent and c4-unit: c4 farm agents reads sessions through c4-agent
  dependencies:
  - name: mrjoshuak/tap/c4-agent
  install: |
    bin.install "c4-farm"
    (share/"c4-farm/skills").install "skills/c4-farm"
  test: |
    system bin/"c4-farm", "help"
- name: c4-agent
  ids: [c4-agent]
  repository:
    owner: mrjoshuak
    name: homebrew-tap
    token: "{{ envOrDefault \"HOMEBREW_TAP_TOKEN\" \"\" }}"
  directory: Formula
  homepage: https://github.com/Avalanche-io/c4-operator
  description: C4's host runner and unit runner, for agent work and tool units on a machine outside the cluster
  license: Apache-2.0
  skip_upload: true
  install: |
    bin.install "c4-agent", "c4-unit"
  test: |
    system bin/"c4-agent", "help"
    assert_match "usage: c4-unit run", shell_output("#{bin}/c4-unit 2>&1", 2)

checksum:
  name_template: checksums.txt

# One image for the manager, the node daemon and the regional tier, for
# linux/amd64 and linux/arm64. GoReleaser puts each platform's binary at
# $TARGETPLATFORM/c4-operator in the build context.
dockers_v2:
- id: c4-operator
  ids: [c4-operator]
  dockerfile: Dockerfile.release
  images: [ghcr.io/avalanche-io/c4-operator]
  tags: ["{{ .Tag }}"]
  platforms: [linux/amd64, linux/arm64]
  labels:
    org.opencontainers.image.title: c4-operator
    org.opencontainers.image.description: "The Cinema Content Creation Cloud: the Kubernetes operator"
    org.opencontainers.image.source: https://github.com/Avalanche-io/c4-operator
    org.opencontainers.image.licenses: Apache-2.0
    org.opencontainers.image.version: "{{ .Tag }}"
    org.opencontainers.image.revision: "{{ .FullCommit }}"

# c4-sync's own image (experimental): it holds tracker credentials the
# operator never sees, so it is not in the operator's image.
- id: c4-sync
  ids: [c4-sync, c4-sandbox-github]
  dockerfile: Dockerfile.c4-sync
  images: [ghcr.io/avalanche-io/c4-sync]
  tags: ["{{ .Tag }}"]
  platforms: [linux/amd64, linux/arm64]
  labels:
    org.opencontainers.image.title: c4-sync
    org.opencontainers.image.description: "C4's tracker sync: GitHub, Flow Production Tracking and MLflow (experimental)"
    org.opencontainers.image.source: https://github.com/Avalanche-io/c4-operator
    org.opencontainers.image.licenses: Apache-2.0
    org.opencontainers.image.version: "{{ .Tag }}"
    org.opencontainers.image.revision: "{{ .FullCommit }}"

changelog:
  use: git
  sort: asc

release:
  github: {owner: Avalanche-io, name: c4-operator}
  draft: true
  prerelease: auto
  extra_files:
  - glob: bin/install.yaml
  - glob: bin/c4-sync.yaml
  footer: |
    Install: `kubectl apply -f https://github.com/Avalanche-io/c4-operator/releases/download/{{ .Tag }}/install.yaml`
    Image: `ghcr.io/avalanche-io/c4-operator:{{ .Tag }}`
    Tracker sync (experimental): `kubectl apply -f https://github.com/Avalanche-io/c4-operator/releases/download/{{ .Tag }}/c4-sync.yaml`, image `ghcr.io/avalanche-io/c4-sync:{{ .Tag }}`
