[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlflow-c4"
version = "0.1.0"
description = "MLflow plugins for C4: run projects on a C4 farm (mlflow run --backend c4) and read c4:// artifacts"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["mlflow>=3.3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."mlflow.project_backend"]
c4 = "mlflow_c4.backend:C4Backend"

[project.entry-points."mlflow.artifact_repository"]
c4 = "mlflow_c4.artifacts:C4ArtifactRepository"

[tool.setuptools.packages.find]
where = ["src"]
