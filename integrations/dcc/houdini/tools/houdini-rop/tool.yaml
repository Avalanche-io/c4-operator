# The C4 Submit ROP's tool: one job per ticked ROP. Set runs.image to the
# studio's Houdini image (and runs.host.exe to where Houdini is installed on
# its workstations) before publishing: c4 farm tool publish <this folder>.
c4: tool/1
name: houdini-rop
title: Houdini ROP
summary: Renders one ROP of a hip file with hython over the unit's frames, without its inputs, which C4 Submit makes jobs of their own.
kind: frames
runs:
  image: registry.example.com/houdini:21.0     # a placeholder: the studio's own Houdini image
  exe: hython
  host:
    has: [houdini-21.0]
    exe:
      linux: /opt/hfs21.0/bin/hython
      windows: "C:/Program Files/Side Effects Software/Houdini 21.0.440/bin/hython.exe"
      macos: /Applications/Houdini/Houdini21.0.440/Frameworks/Houdini.framework/Versions/Current/Resources/bin/hython
  # Scenes saved under another root (a Windows or home folder) are mapped to the farm's.
  env: {HOUDINI_PATHMAP: "{{Run.PathMap.houdini}}"}
  command: ["{{Run.Exe}}", "{{Tool.Dir}}/houdini_rop.py", "{{Param.hip}}", "{{Param.rop}}", "{{Unit.Frames}}"]
frames: {chunk: 4, order: binary}
params:
- name: hip
  type: PATH
  objectType: FILE
  dataFlow: IN
  description: The saved hip file. A .py that builds the scene and saves it to the path it is given also works, which is how the test makes one.
  show: artist
  from: scene.file
  userInterface: {control: CHOOSE_INPUT_FILE, label: Hip file, fileFilters: [{label: Houdini, patterns: ["*.hip", "*.hiplc", "*.hipnc"]}]}
- name: rop
  type: STRING
  minLength: 1
  description: The ROP to render, by path, as /out/mantra1. It is rendered without its inputs; a ROP it reads is its own job, or was rendered before.
  show: artist
  from: scene.renderables
  userInterface: {control: LINE_EDIT, label: ROP}
errors:
  licence: ['No licenses could be found to run this application']
retries: 2
reuse: exact
test:
  tree: test/
  frames: 1001-1002
  with: {hip: fx/rop_setup.py, rop: /out/cache}
  expect: [fx/geo/box.1001.bgeo.sc, fx/geo/box.1002.bgeo.sc]
