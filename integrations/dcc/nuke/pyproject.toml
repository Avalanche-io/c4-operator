[project]
name = "c4-nuke"
version = "0.1.0"
description = "Submit a Nuke script to a C4 farm from inside Nuke: the Nuke panel over c4submit"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

# Tests find c4submit in ../c4submit/src and a fake nuke in tests/ (conftest.py);
# nothing needs installing.
[tool.pytest.ini_options]
testpaths = ["tests"]
