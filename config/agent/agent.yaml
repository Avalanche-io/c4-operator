apiVersion: v1
kind: ServiceAccount
metadata:
  name: c4-operator-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c4-operator-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: c4-operator-agent
subjects:
- kind: ServiceAccount
  name: c4-operator-agent
  namespace: c4-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: c4-operator-agent
  labels:
    app.kubernetes.io/name: c4-operator
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: c4-operator
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c4-operator
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: c4-operator-agent
      containers:
      - name: agent
        image: c4-operator
        args:
        - agent
        - --root=/var/lib/c4
        - --cache-size=20Gi
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            memory: 1Gi
        securityContext:
          # Root to own the cache on the node; no other privilege.
          runAsUser: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
            add: [CHOWN, DAC_OVERRIDE, FOWNER]
        volumeMounts:
        - name: cache
          mountPath: /var/lib/c4
      volumes:
      - name: cache
        hostPath:
          path: /var/lib/c4
          type: DirectoryOrCreate
