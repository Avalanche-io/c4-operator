# The node daemon: CSI node plugin, node object cache and layer builder,
# and the peer tier of its locality. Privileged, because it mounts
# overlays, creates whiteouts and owns the cache; user pods get none of
# that, only a csi volume.
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: c4.avalanche.io
spec:
  attachRequired: false
  # kubelet passes pod name, namespace, UID and service account.
  podInfoOnMount: true
  # Inline ephemeral volumes in the pod spec; no PVs.
  volumeLifecycleModes: [Ephemeral]
  # kubelet must never chown a view recursively: that would copy every
  # file up into the volume's upper.
  fsGroupPolicy: None
  # A token for the pod, audience c4.avalanche.io, checked with
  # TokenReview at NodePublishVolume.
  tokenRequests:
  - audience: c4.avalanche.io
    expirationSeconds: 3600
  # Pass the token in the request's secrets field rather than in volume
  # attributes, so it is never logged with them.
  serviceAccountTokenInSecrets: true
  requiresRepublish: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: c4-node
  labels:
    app.kubernetes.io/name: c4-operator
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: c4-operator
      app.kubernetes.io/component: node
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c4-operator
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: c4-node
      priorityClassName: system-node-critical
      # Peers dial each other on the node address.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Every node with a locality runs a daemon, including tainted burst
      # nodes, which are where pre-warming matters most.
      tolerations:
      - operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: topology.kubernetes.io/zone, operator: Exists}
      containers:
      - name: node
        image: c4-operator
        args:
        - node
        - --root=/var/lib/c4
        - --cache-size=20Gi
        - --csi-socket=/csi/csi.sock
        - --peer-addr=:7444
        - --peer-port=7444
        env:
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        securityContext:
          privileged: true
        ports:
        - {name: tier, containerPort: 7444}
        readinessProbe:
          httpGet: {path: /healthz, port: 7444}
          periodSeconds: 5
        resources:
          requests: {cpu: 200m, memory: 128Mi}
          limits: {memory: 2Gi}
        volumeMounts:
        - {name: plugin-dir, mountPath: /csi}
        - {name: pods-dir, mountPath: /var/lib/kubelet/pods, mountPropagation: Bidirectional}
        - {name: cache, mountPath: /var/lib/c4}
        - {name: tier-token, mountPath: /var/run/secrets/c4-tier, readOnly: true}
      - name: registrar
        image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.15.0
        imagePullPolicy: IfNotPresent
        args:
        - --csi-address=/csi/csi.sock
        - --kubelet-registration-path=/var/lib/kubelet/plugins/c4.avalanche.io/csi.sock
        resources:
          requests: {cpu: 10m, memory: 16Mi}
        volumeMounts:
        - {name: plugin-dir, mountPath: /csi}
        - {name: registration-dir, mountPath: /registration}
      volumes:
      - name: plugin-dir
        hostPath: {path: /var/lib/kubelet/plugins/c4.avalanche.io, type: DirectoryOrCreate}
      - name: registration-dir
        hostPath: {path: /var/lib/kubelet/plugins_registry, type: Directory}
      - name: pods-dir
        hostPath: {path: /var/lib/kubelet/pods, type: Directory}
      - name: cache
        hostPath: {path: /var/lib/c4, type: DirectoryOrCreate}
      # The daemon's own identity toward peers and the regional tier.
      - name: tier-token
        projected:
          sources:
          - serviceAccountToken: {audience: c4-tier, expirationSeconds: 3600, path: token}
