apiVersion: v1
kind: ServiceAccount
metadata:
  name: c4-operator-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c4-operator-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: c4-operator-manager
subjects:
- kind: ServiceAccount
  name: c4-operator-manager
  namespace: c4-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c4-operator-manager
  labels:
    app.kubernetes.io/name: c4-operator
    app.kubernetes.io/component: manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: c4-operator
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c4-operator
        app.kubernetes.io/component: manager
    spec:
      serviceAccountName: c4-operator-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: c4-operator
        args:
        - manager
        - --init-image=$(INIT_IMAGE)
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: INIT_IMAGE
          value: c4-operator:dev
        ports:
        - name: webhook
          containerPort: 9443
        - name: metrics
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
