apiVersion: apps/v1
kind: Deployment
metadata:
  name: c4-manager
  labels:
    app.kubernetes.io/name: c4-operator
    app.kubernetes.io/component: manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: c4-operator
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c4-operator
        app.kubernetes.io/component: manager
    spec:
      serviceAccountName: c4-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: manager
        image: c4-operator
        args: [manager]
        env:
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - name: POD_SERVICE_ACCOUNT
          valueFrom: {fieldRef: {fieldPath: spec.serviceAccountName}}
        ports:
        - {name: webhook, containerPort: 9443}
        - {name: metrics, containerPort: 8080}
        - {name: hud, containerPort: 8090}
        - {name: signer, containerPort: 8092}
        readinessProbe:
          httpGet: {path: /readyz, port: 8081}
        livenessProbe:
          httpGet: {path: /healthz, port: 8081}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 1Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
        # The operator's identity toward the sites' regional replicas, for
        # staging (--staging): what a site holds, and asking it to warm.
        - {name: tier-token, mountPath: /var/run/secrets/c4-tier, readOnly: true}
      volumes:
      - name: tmp
        emptyDir: {}
      - name: tier-token
        projected:
          sources:
          - serviceAccountToken: {audience: c4-tier, expirationSeconds: 3600, path: token}
---
# The HUD: the web app and its API. Put an SSO proxy (or an Ingress with
# authentication) in front of it, or reach it with bearer tokens.
apiVersion: v1
kind: Service
metadata:
  name: c4-hud
  labels:
    app.kubernetes.io/name: c4-operator
    app.kubernetes.io/component: hud
spec:
  selector:
    app.kubernetes.io/name: c4-operator
    app.kubernetes.io/component: manager
  ports:
  - {name: hud, port: 80, targetPort: 8090}
