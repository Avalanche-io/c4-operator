---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c4-operator-manager
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - mutatingwebhookconfigurations
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - c4.avalanche.io
  resources:
  - materializations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - c4.avalanche.io
  resources:
  - materializations/status
  verbs:
  - get
  - patch
  - update
