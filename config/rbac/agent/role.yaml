---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c4-operator-agent
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - list
- apiGroups:
  - c4.avalanche.io
  resources:
  - materializations
  verbs:
  - get
- apiGroups:
  - c4.avalanche.io
  resources:
  - materializations/status
  verbs:
  - get
  - update
