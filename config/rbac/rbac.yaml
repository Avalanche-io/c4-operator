# Service accounts and RBAC. Store credentials are Secrets in c4-system,
# readable only through the namespaced Roles below; nothing here can read a
# Secret in any other namespace (the MVP's cluster-wide Secret read is gone).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: c4-manager
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: c4-node
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: c4-regional
---
# Manager: resolves Materializations, validates Projects, publishes view
# records to project stores, runs the pod webhook.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c4-manager
rules:
- apiGroups: [c4.avalanche.io]
  resources: [materializations, projects]
  verbs: [get, list, watch]
- apiGroups: [c4.avalanche.io]
  resources: [materializations/status, projects/status]
  verbs: [get, update, patch]
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
- apiGroups: [admissionregistration.k8s.io]
  resources: [mutatingwebhookconfigurations]
  resourceNames: [c4-operator]
  verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c4-manager
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: c4-manager}
subjects:
- {kind: ServiceAccount, name: c4-manager, namespace: c4-system}
---
# Work queue (in the manager): releases units as pods in any namespace that
# has WorkJobs, writes job, pool and capacity status, and advertises each
# pool node's slots as an extended resource (nodes/status). Patching Node
# taints is for the kind-sim capacity provider only; production adapters
# (Cluster Autoscaler ProvisioningRequests, Karpenter) need none of it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c4-queue
rules:
- apiGroups: [c4.avalanche.io]
  resources: [workjobs, pools, capacityrequests, milestones, submitgrants]
  verbs: [get, list, watch]
- apiGroups: [c4.avalanche.io]
  resources: [workjobs/status, pools/status, capacityrequests/status, milestones/status]
  verbs: [get, update, patch]
- apiGroups: [c4.avalanche.io]
  resources: [capacityrequests]
  verbs: [create, update, patch, delete]
# Burst through Cluster Autoscaler (--capacity-provider provisioning-request):
# ProvisioningRequests and their PodTemplates, in the operator's namespace.
- apiGroups: [autoscaling.x-k8s.io]
  resources: [provisioningrequests]
  verbs: [get, list, watch, create, delete]
- apiGroups: [""]
  resources: [podtemplates]
  verbs: [get, list, watch, create]
# Unit pods run at the c4-unit PriorityClass when it exists.
- apiGroups: [scheduling.k8s.io]
  resources: [priorityclasses]
  verbs: [get, list, watch]
# Resumed units mount the view their last attempt captured, through a
# Materialization the queue owns in the job's namespace.
- apiGroups: [c4.avalanche.io]
  resources: [materializations]
  verbs: [create, patch]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch, create, patch, delete]
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, watch, patch]
- apiGroups: [""]
  resources: [nodes/status]
  verbs: [patch]
# A unit counts as sealed for the derivation record only when a network
# policy denies its pod egress; the queue reads the policies to know.
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [get, list, watch, create, update]
# Tool profiles: the queue reads a unit's profile and the services its
# egress names, and writes the profile's NetworkPolicy in the job's
# namespace.
- apiGroups: [c4.avalanche.io]
  resources: [toolprofiles]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [services]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c4-queue
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: c4-queue}
subjects:
- {kind: ServiceAccount, name: c4-manager, namespace: c4-system}
---
# Agent bundles (in the manager): each AgentBundle owns one WorkJob of class
# agent, whose units are the bundle's members; the controller writes it and
# reports the members from its unit pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c4-agent-bundles
rules:
- apiGroups: [c4.avalanche.io]
  resources: [agentbundles]
  verbs: [get, list, watch]
- apiGroups: [c4.avalanche.io]
  resources: [agentbundles/status]
  verbs: [get, update, patch]
- apiGroups: [c4.avalanche.io]
  resources: [workjobs]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c4-agent-bundles
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: c4-agent-bundles}
subjects:
- {kind: ServiceAccount, name: c4-manager, namespace: c4-system}
---
# Credential leases (in the manager): the controller keeps a lease's state
# and deletes its Secret when the lease lapses or the farm does not allow
# its mode. It never reads a lease's Secret: delete is its only verb on
# Secrets (the holder's agent writes them). The work queue reads leases to
# decide which unit pods may mount one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c4-credential-leases
rules:
- apiGroups: [c4.avalanche.io]
  resources: [credentialleases]
  verbs: [get, list, watch]
- apiGroups: [c4.avalanche.io]
  resources: [credentialleases/status]
  verbs: [get, update, patch]
- apiGroups: [""]
  resources: [secrets]
  verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c4-credential-leases
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: c4-credential-leases}
subjects:
- {kind: ServiceAccount, name: c4-manager, namespace: c4-system}
---
# HUD (in the manager): reads unit pod logs and events, scrapes the node
# daemons' and regional replicas' metrics, authenticates viewers
# (TokenReview), checks each viewer's access and each control's write
# (SubjectAccessReview), makes the control's write, and records it as an
# Event naming the user.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c4-hud
rules:
- apiGroups: [c4.avalanche.io]
  resources: [workjobs, capacityrequests]
  verbs: [get, list, watch, patch]
- apiGroups: [c4.avalanche.io]
  resources: [milestones]
  verbs: [get, list, watch]
# Submit grants (GAPS 17): the HUD is their only writer, for the person
# signed in; it reads the Tracker a grant names.
- apiGroups: [c4.avalanche.io]
  resources: [submitgrants]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [c4.avalanche.io]
  resources: [trackers]
  verbs: [get, list, watch]
# Submitting for a signed-in viewer (POST /api/v1/jobs), after a
# SubjectAccessReview says the viewer may create the same objects.
- apiGroups: [c4.avalanche.io]
  resources: [workjobs, materializations]
  verbs: [create]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get]
- apiGroups: [""]
  resources: [events]
  verbs: [list, create]
- apiGroups: [authentication.k8s.io]
  resources: [tokenreviews]
  verbs: [create]
- apiGroups: [authorization.k8s.io]
  resources: [subjectaccessreviews]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c4-hud
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: c4-hud}
subjects:
- {kind: ServiceAccount, name: c4-manager, namespace: c4-system}
---
# Node daemon: reads Projects, Materializations (by name, on demand) and
# the Nodes of its locality; validates pod and tier tokens; annotates pods
# with capture results. A ValidatingAdmissionPolicy (config/policy)
# narrows the pod patch to output annotations on pods of its own node.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c4-node
rules:
- apiGroups: [c4.avalanche.io]
  resources: [projects]
  verbs: [get, list, watch]
- apiGroups: [c4.avalanche.io]
  resources: [materializations]
  verbs: [get]
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, patch]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
- apiGroups: [authentication.k8s.io]
  resources: [tokenreviews]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c4-node
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: c4-node}
subjects:
- {kind: ServiceAccount, name: c4-node, namespace: c4-system}
---
# Regional tier: reads Projects and validates tier tokens.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c4-regional
rules:
- apiGroups: [c4.avalanche.io]
  resources: [projects]
  verbs: [get, list, watch]
- apiGroups: [authentication.k8s.io]
  resources: [tokenreviews]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c4-regional
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: c4-regional}
subjects:
- {kind: ServiceAccount, name: c4-regional, namespace: c4-system}
---
# Store credentials: the manager and the regional tier read them. The node
# daemon needs them only for projects with access: Direct; an installation
# without Direct projects can remove c4-node from this binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: c4-store-credentials
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: c4-store-credentials
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: c4-store-credentials}
subjects:
- {kind: ServiceAccount, name: c4-manager, namespace: c4-system}
- {kind: ServiceAccount, name: c4-regional, namespace: c4-system}
- {kind: ServiceAccount, name: c4-node, namespace: c4-system}
---
# Work queue calibrations: the queue saves each project's calibrations in
# that project's own store and keeps the pointer to the latest object in
# the ConfigMap c4-work-calibrations (project: C4 ID), here only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: c4-queue-calibrations
rules:
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [c4-work-calibrations]
  verbs: [get, patch]
# The transition log (internal/work/queue/book.go): c4-work-book (the
# number) and one c4-work-book-<project> per project, each updated with its
# resourceVersion, so a stale leader cannot fork the log. RBAC names no
# prefix, so this is any ConfigMap in the operator's own namespace, which
# only the operator writes.
- apiGroups: [""]
  resources: [configmaps]
  verbs: [create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: c4-queue-calibrations
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: c4-queue-calibrations}
subjects:
- {kind: ServiceAccount, name: c4-manager, namespace: c4-system}
---
# Node daemons find the regional tier through its EndpointSlices.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: c4-node-discovery
rules:
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: c4-node-discovery
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: c4-node-discovery}
subjects:
- {kind: ServiceAccount, name: c4-node, namespace: c4-system}
