# Host runners: `c4 farm agent --runner` (or `c4-agent runner`) on a
# person's own machine, running the members of their agent bundles. Each
# machine signs in as its own service account in c4-hosts, named for the
# machine's Node (c4-hosts/laptop-1 for the Node laptop-1). The c4-host-runner
# admission policies (config/policy/host-runner.yaml) narrow what RBAC
# grants here to that one Node, its Lease, and the pods bound to it.
apiVersion: v1
kind: Namespace
metadata:
  name: c4-hosts
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c4-host-runner
rules:
# its own Node only (the node policy holds every write to the Node named
# for its account); it never lists or watches the farm's machines
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, create, patch]
- apiGroups: [""]
  resources: [nodes/status]
  verbs: [patch]
# its own pods, which it reads only through the HUD (GET
# /api/v1/nodes/<node>/pods): it may not get, list or watch any pod here,
# so its token reads nothing of anyone else's work, nor bind one (the
# queue creates host pods bound). patch and delete are held by the pod
# policy to pods bound to its Node; delete only finishes the deletion of
# a pod the farm is already deleting, as a kubelet does.
- apiGroups: [""]
  resources: [pods]
  verbs: [patch, delete]
- apiGroups: [""]
  resources: [pods/status]
  verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c4-host-runner
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: c4-host-runner}
subjects:
- {kind: Group, apiGroup: rbac.authorization.k8s.io, name: "system:serviceaccounts:c4-hosts"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: c4-host-runner
  namespace: kube-node-lease
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: c4-host-runner
  namespace: kube-node-lease
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: c4-host-runner}
subjects:
- {kind: Group, apiGroup: rbac.authorization.k8s.io, name: "system:serviceaccounts:c4-hosts"}
