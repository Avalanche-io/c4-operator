# The farm's egress proxy (c4-operator egress-proxy). A unit whose tool
# profile allows hosts reaches them only through it: the queue points the
# unit's HTTPS_PROXY and HTTP_PROXY here and its NetworkPolicy allows only
# this and DNS; the proxy lets a request through only to a host the unit's
# profile lists, and logs each against the unit. The manager's
# --egress-proxy names this Service.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: c4-egress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c4-egress
rules:
# Which unit pod a client address is, and its tool profile.
- apiGroups: [""]
  resources: [pods]
  verbs: [list]
- apiGroups: [c4.avalanche.io]
  resources: [toolprofiles]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c4-egress
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: c4-egress}
subjects:
- {kind: ServiceAccount, name: c4-egress, namespace: c4-system}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c4-egress
  labels:
    app.kubernetes.io/name: c4-operator
    app.kubernetes.io/component: egress
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: c4-operator
      app.kubernetes.io/component: egress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c4-operator
        app.kubernetes.io/component: egress
    spec:
      serviceAccountName: c4-egress
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 10
      containers:
      - name: egress
        image: c4-operator
        args: [egress-proxy, --addr=:3128]
        env:
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        ports:
        - {name: proxy, containerPort: 3128}
        readinessProbe:
          httpGet: {path: /healthz, port: 3128}
          periodSeconds: 3
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: c4-egress
  labels:
    app.kubernetes.io/name: c4-operator
    app.kubernetes.io/component: egress
spec:
  selector:
    app.kubernetes.io/name: c4-operator
    app.kubernetes.io/component: egress
  ports:
  - {name: proxy, port: 3128, targetPort: 3128}
