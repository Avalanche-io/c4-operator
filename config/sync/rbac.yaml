# c4-sync reads Trackers and keeps TrackerLinks. It reads no Secret here:
# each project grants it its own Tracker's credential Secrets by name, in
# its own namespace (config/samples/tracker-github/role.yaml). It changes
# jobs only through the HUD API, as its own identity, so the HUD checks
# and books every change. The one farm object it writes itself is a
# Milestone, a tracker's date that jobs take (intake as milestone), owned
# by its Tracker.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: c4-sync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c4-sync
rules:
- apiGroups: [c4.avalanche.io]
  resources: [trackers]
  verbs: [get, list, watch]
- apiGroups: [c4.avalanche.io]
  resources: [trackerlinks]
  # patch: a rework that makes a next version moves the link to it;
  # delete: a forecast withdrawn takes its link with it.
  verbs: [get, list, watch, create, patch, update, delete]
- apiGroups: [c4.avalanche.io]
  resources: [trackers/status, trackerlinks/status]
  verbs: [get, patch, update]
- apiGroups: [c4.avalanche.io]
  resources: [milestones]
  verbs: [get, list, create, patch, update]
# A project's due time (spec.work.dueTime), for due dates with no time.
- apiGroups: [c4.avalanche.io]
  resources: [projects]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c4-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: c4-sync
subjects:
- kind: ServiceAccount
  name: c4-sync
  namespace: c4-system
