apiVersion: apps/v1
kind: Deployment
metadata:
  name: c4-sync
  labels:
    app.kubernetes.io/name: c4-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: c4-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c4-sync
    spec:
      serviceAccountName: c4-sync
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: sync
        image: c4-sync
        args: [--hud=http://c4-hud.c4-system.svc, --hud-token-file=/var/run/c4-sync/token]
        ports:
        - {name: webhooks, containerPort: 8090}
        readinessProbe:
          httpGet: {path: /healthz, port: 8090}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: hud-token, mountPath: /var/run/c4-sync, readOnly: true}
      volumes:
      # A projected token for the HUD alone (audience
      # c4.avalanche.io/hud-api, which the API server refuses): short-lived
      # and rotated by the kubelet, never a long-lived Secret.
      - name: hud-token
        projected:
          sources:
          - serviceAccountToken: {path: token, audience: c4.avalanche.io/hud-api, expirationSeconds: 3600}
---
# Tracker deliveries arrive here, behind the studio's ingress or a relay;
# sites that cannot take inbound traffic poll instead (Tracker.spec.events).
apiVersion: v1
kind: Service
metadata:
  name: c4-sync
spec:
  selector:
    app.kubernetes.io/name: c4-sync
  ports:
  - {name: webhooks, port: 80, targetPort: webhooks}
