# A one-shard store for the quickstart: MinIO on the control plane, reached
# by the cluster at minio.c4-store:9000 and by this machine at
# 127.0.0.1:30900, with a bucket named quickstart. The credentials are for
# a local trial only.
apiVersion: v1
kind: Namespace
metadata:
  name: c4-store
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio, namespace: c4-store}
spec:
  replicas: 1
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      nodeSelector: {node-role.kubernetes.io/control-plane: ""}
      tolerations: [{operator: Exists}]
      containers:
      - name: minio
        image: minio/minio:latest
        args: [server, /data]
        env:
        - {name: MINIO_ROOT_USER, value: quickstart}
        - {name: MINIO_ROOT_PASSWORD, value: quickstart-secret}
        ports: [{containerPort: 9000}]
        readinessProbe: {httpGet: {path: /minio/health/ready, port: 9000}}
        volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: minio, namespace: c4-store}
spec:
  type: NodePort
  selector: {app: minio}
  ports: [{port: 9000, targetPort: 9000, nodePort: 30900}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: bucket, namespace: c4-store}
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: minio/mc:latest
        command: [sh, -c]
        args:
        - until mc alias set q http://minio.c4-store:9000 quickstart quickstart-secret; do sleep 2; done;
          mc mb --ignore-existing q/quickstart
