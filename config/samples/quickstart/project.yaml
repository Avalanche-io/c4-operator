# A project for the quickstart: the namespace demo, the quickstart store
# (credentials in the Secret quickstart-store in c4-system), a cpu pool of
# two slots per node, and the HUD on 127.0.0.1:30080.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    # Pods in a project namespace need nothing beyond restricted: a view
    # is a csi volume.
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: c4.avalanche.io/v1alpha1
kind: Project
metadata: {name: demo}
spec:
  namespaces: [demo]
  isolation: Strict
  store:
    access: Tiered
    credentialsSecretRef: {name: quickstart-store}
    shards:
    - {name: s0, url: "s3://quickstart/c4/?endpoint=http://garage-s3.c4-store:3900"}
---
apiVersion: c4.avalanche.io/v1alpha1
kind: Pool
metadata: {name: cpu}
spec:
  nodeSelector: {c4.avalanche.io/pool: cpu}
  slotsPerNode: 2
  costPerSlotHour: "0.40"
---
apiVersion: v1
kind: Service
metadata: {name: c4-hud-quickstart, namespace: c4-system}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: c4-operator, app.kubernetes.io/component: manager}
  ports: [{port: 8090, targetPort: 8090, nodePort: 30080}]
