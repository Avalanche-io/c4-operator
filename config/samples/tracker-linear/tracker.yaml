# A Linear team syncing with the farm (experimental: c4-sync). Open
# issues labeled c4 and render become render jobs whose deadline is 18:00
# Los Angeles time on the issue's due date (Linear stores dates without
# times). Work states go to the issue: the team's first started state
# while the work runs, In Review when it is up for review, and one status
# card (an attachment) at the job's HUD page. Each output is an attachment
# carrying its output view's C4 ID. The reviewer's move to Changes
# Requested, with their comment, comes back as a rework that makes the next
# version; their move to Done approves it. c4-sync never moves an issue to
# a completed or canceled state.
#
# State names are this sample team's: Linear lets each team rename and add
# states. A move to a completed-type state approves whatever its name; map
# the others by name.
apiVersion: c4.avalanche.io/v1alpha1
kind: Tracker
metadata:
  name: widgets-linear
  namespace: widgets
spec:
  kind: linear
  # endpoint defaults to https://api.linear.app/graphql
  scope:
    team: ENG
  credential:
    # A personal API key limited to this team, or an OAuth app actor's
    # access token.
    secret: {name: widgets-linear-key, key: key}
  webhookSecret: {name: widgets-linear-webhook, key: secret}
  events: {mode: webhook, pollSeconds: 60, resyncSeconds: 900}
  # Linear allows 2,500 requests an hour per API key.
  rate: {perSecond: "0.5", burst: 10}
  people:
    dana@example.com: dana
  intake:
  - match:
      type: Issue
      labels: [c4, render]
    as: job
    # whose work the jobs are: the first assignee the people map names,
    # once they let this Tracker submit for them (their page in the HUD)
    for: {assignee: true}
    deadline: {dateOnlyAt: "18:00", timeZone: America/Los_Angeles}
    review: {wait: review}
    rework: nextVersion
    job:
      class: render
      params: {frames: "1-240", chunk: "4"}
      template:
        spec:
          containers:
          - name: render
            image: ghcr.io/avalanche-io/c4-job-karma:dev
  statusOut:
    states: {in-review: In Review}
    fieldSeconds: 300
  verdictsIn:
    "state:Changes Requested": rework
