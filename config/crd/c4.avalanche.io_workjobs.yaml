---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: workjobs.c4.avalanche.io
spec:
  group: c4.avalanche.io
  names:
    kind: WorkJob
    listKind: WorkJobList
    plural: workjobs
    shortNames:
    - wj
    singular: workjob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.class
      name: Class
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.units.succeeded
      name: Done
      type: integer
    - jsonPath: .status.units.total
      name: Total
      type: integer
    - jsonPath: .status.estimate.slackSeconds
      name: Slack
      type: integer
    - jsonPath: .status.rank
      name: Rank
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: WorkJob is a job in the farm's queue.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WorkJobSpec declares a job: its class, its units' parameters, its
              objective, where it may run, its inputs and outputs, and the pod each
              unit runs.
            properties:
              avoidNodes:
                description: |-
                  AvoidNodes are nodes a person took out of this job's use; the queue
                  adds nodes that failed its units NodeErrorLimit times.
                items:
                  type: string
                type: array
              class:
                description: 'Class names the work class: render, ci, ml, agent or
                  graph.'
                enum:
                - render
                - ci
                - ml
                - agent
                - graph
                type: string
              deadline:
                description: |-
                  Deadline is the job's own deadline. Without one, the class's
                  objective applies (a latency target from the time the job became
                  ready, or a default turnaround).
                format: date-time
                type: string
              deadlineMode:
                description: |-
                  DeadlineMode says who owns the deadline. Pinned: Deadline, set by a
                  person or a tool (the default when Deadline is set). Suggested: the
                  farm suggests one from the deadline policy (the project's, else the
                  class's), the job's estimate and the first units' measurements; it
                  revises the suggestion at most a few times and then settles it, and
                  never moves a settled one (the default when Deadline is not set and
                  the policy is not a latency SLO). Tracking: production tracking
                  writes Deadline; the farm never suggests one.
                enum:
                - Pinned
                - Suggested
                - Tracking
                type: string
              dependsOn:
                description: DependsOn names jobs in this namespace that must succeed
                  first.
                items:
                  type: string
                type: array
              inputs:
                description: Inputs are C4 views mounted into every unit.
                items:
                  description: |-
                    WorkInput mounts a view into every unit: a Materialization, or the
                    output view of another job in the namespace.
                  properties:
                    fromJob:
                      description: |-
                        FromJob mounts the output view of that job (in this namespace) once
                        it has succeeded. List it in dependsOn too.
                      type: string
                    materialization:
                      description: Materialization in the job's namespace.
                      type: string
                    mountPath:
                      description: MountPath in every container of the unit.
                      type: string
                    readOnly:
                      description: ReadOnly mounts without capture.
                      type: boolean
                  required:
                  - mountPath
                  type: object
                type: array
              maxParallel:
                description: 'MaxParallel caps the job''s running units (0: no cap).'
                format: int32
                type: integer
              nodeErrorLimit:
                default: 3
                description: |-
                  NodeErrorLimit blacklists a node for this job after this many unit
                  failures on it.
                format: int32
                type: integer
              nudge:
                description: Nudge holds or boosts the job. There are no priorities.
                properties:
                  boost:
                    description: |-
                      Boost multiplies the job's required slots, from 1 to 2, drawn from
                      its own project's quota first.
                    pattern: ^(1(\.[0-9]+)?|2(\.0+)?)$
                    type: string
                  hold:
                    description: Hold releases no new units; running units finish.
                    type: boolean
                  holdStop:
                    description: HoldStop holds and stops running units.
                    type: boolean
                type: object
              params:
                additionalProperties:
                  type: string
                description: |-
                  Params are the class's parameters, for example frames and chunk for
                  render, shards for ci, steps for ml.
                type: object
              pools:
                description: Pools the job's units may run in. Empty means the class's
                  defaults.
                items:
                  type: string
                type: array
              retries:
                default: 2
                description: Retries per unit after the first attempt.
                format: int32
                type: integer
              template:
                description: |-
                  Template is the pod every unit runs. The queue adds the unit's
                  environment (C4_UNIT, and the class's variables), the pool's node
                  selector and tolerations, and the input volumes. The API server
                  validates it when the queue creates each pod; the CRD does not
                  repeat the pod schema (it would exceed what kubectl apply can carry).
                type: object
                x-kubernetes-preserve-unknown-fields: true
            required:
            - class
            - template
            type: object
          status:
            description: |-
              WorkJobStatus is the queue's view of a job. Per-unit state is kept as
              run-length index sets, so its size grows with state changes along the
              unit range, not with the number of units.
            properties:
              acked:
                description: |-
                  Acked is the token of the last acknowledgement request carried out
                  (AnnotationAcks).
                type: string
              acks:
                description: |-
                  Acks are the standing acknowledgements: who took, was assigned or
                  accepted which failed units, and when. A requeue clears a unit's.
                items:
                  description: WorkAck is a standing acknowledgement of failed units.
                  properties:
                    actor:
                      type: string
                    assignee:
                      type: string
                    at:
                      format: date-time
                      type: string
                    kind:
                      type: string
                    note:
                      type: string
                    record:
                      type: string
                    units:
                      type: string
                  required:
                  - actor
                  - at
                  - kind
                  - units
                  type: object
                type: array
              attempts:
                description: |-
                  Attempts per unit index, for units tried more than once
                  ("index:attempts" pairs, comma-separated).
                type: string
              blacklist:
                description: Blacklist holds nodes this job will not use.
                items:
                  type: string
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deadline:
                description: Deadline is the effective deadline.
                format: date-time
                type: string
              deadlineSource:
                description: |-
                  DeadlineSource says where Deadline comes from: spec (Pinned or
                  Tracking), suggested, or class (the class's objective).
                type: string
              decided:
                description: |-
                  Decided is the token of the last decision carried out
                  (AnnotationDecide).
                type: string
              decisions:
                description: |-
                  Decisions lists the most recent preemptions and yields the queue
                  decided for this job's units, each with its signed decision record.
                items:
                  description: |-
                    WorkDecision is one scheduling decision that stopped or asked a unit to
                    yield.
                  properties:
                    at:
                      format: date-time
                      type: string
                    for:
                      description: For is the job the slots went to, if any.
                      type: string
                    kind:
                      description: Kind is yield (stop at the next checkpoint) or
                        stop.
                      type: string
                    reason:
                      type: string
                    record:
                      description: Record is the C4 ID of the queue's signed decision
                        record.
                      type: string
                    unit:
                      format: int32
                      type: integer
                  required:
                  - at
                  - kind
                  - reason
                  - unit
                  type: object
                type: array
              derivation:
                description: |-
                  Derivation is the record of the job's process. Experimental: it
                  will change with C4's derivation-record design.
                properties:
                  class:
                    description: |-
                      Class is the class the record supports. An exact declaration reads
                      as validated once a re-run wrote a different output, or while its
                      pods are not sealed. Verified: an exact class has been confirmed by
                      re-runs that wrote the same output, which is what allows reusing an
                      output in place of moving it.
                    type: string
                  declared:
                    description: |-
                      Declared is the class the job declared (annotation
                      c4.avalanche.io/derivation-class): exact, validated or volatile.
                    type: string
                  matched:
                    description: |-
                      Matched and Mismatched count re-runs of the same process on the same
                      inputs that wrote the same output, or another.
                    format: int32
                    type: integer
                  mismatched:
                    format: int32
                    type: integer
                  program:
                    description: |-
                      Program is the ID of the program the job's units run: images,
                      command and parameters, without what tells one unit from another
                      (frames, shards). Evidence and class accrue to it.
                    type: string
                  verified:
                    type: boolean
                  why:
                    description: Why says why the class is not the declared one.
                    type: string
                required:
                - class
                - declared
                - program
                type: object
              estimate:
                description: Estimate is the remaining-work estimate and objective
                  state.
                properties:
                  atRisk:
                    type: boolean
                  attainableSlots:
                    type: string
                  calibrated:
                    description: |-
                      Calibrated says the percentiles come from finished jobs' outcomes
                      (live calibration), not from the estimator's own spread.
                    type: boolean
                  eta50:
                    description: |-
                      ETA50 and ETA90 are the finish a person is shown, at 50 and 90%:
                      the plan's finish with the calibrated percentiles of the remaining
                      work, and half the critical path as the last wave's tail (the
                      scheduler's own, more conservative finish is what it decides on).
                    format: date-time
                    type: string
                  eta80:
                    description: ETA80 and ETA95 complete the band.
                    format: date-time
                    type: string
                  eta90:
                    format: date-time
                    type: string
                  eta95:
                    format: date-time
                    type: string
                  feasible:
                    type: boolean
                  heavyRegions:
                    description: HeavyRegions are axis ranges well above the job's
                      median cost.
                    items:
                      description: HeavyRegion is a range of the unit axis that costs
                        more than the median.
                      properties:
                        factor:
                          type: string
                        from:
                          format: int32
                          type: integer
                        to:
                          format: int32
                          type: integer
                      required:
                      - factor
                      - from
                      - to
                      type: object
                    type: array
                  message:
                    type: string
                  p90RemainingSeconds:
                    format: int64
                    type: integer
                  remainingSeconds:
                    description: |-
                      RemainingSeconds is wall-clock time to the ETA (p50): the plan's
                      answer, after allocation.
                    format: int64
                    type: integer
                  remainingWork:
                    description: |-
                      RemainingWork is the estimated work left (W) and its 90th percentile
                      (W90), in slot-seconds: the estimator's answer, before allocation.
                    format: int64
                    type: integer
                  remainingWorkP90:
                    format: int64
                    type: integer
                  requiredSlots:
                    type: string
                  risk:
                    description: |-
                      Risk is the deadline risk a person is shown: none, atRisk (the
                      band at the job's quantile, 0.95 for a suggested deadline and 0.9
                      otherwise, ends after the deadline, or the scheduler's conservative
                      finish does), willMiss (late even with every slot it can get, or
                      the median finish is after the deadline) or missed (the deadline
                      has passed and the job is not finished).
                    type: string
                  runningSlots:
                    format: int32
                    type: integer
                  slackSeconds:
                    format: int64
                    type: integer
                type: object
              expansions:
                description: |-
                  Expansions lists every generator unit evaluated, in the order its
                  children were added: the unit table is the class's plan with these
                  applied, so a restart rebuilds it from the documents in the store
                  (DESIGN 10.6).
                items:
                  description: |-
                    WorkExpansion is one generator's evaluation: its expansion document
                    added Units children, indexes First to First+Units-1.
                  properties:
                    at:
                      format: date-time
                      type: string
                    document:
                      description: Document is the C4 ID of the expansion document.
                      type: string
                    error:
                      description: |-
                        Error says why the document was refused; it added no units and the
                        generator failed.
                      type: string
                    first:
                      format: int32
                      type: integer
                    record:
                      description: Record is the C4 ID of the queue's signed expansion
                        record.
                      type: string
                    unit:
                      format: int32
                      type: integer
                    units:
                      format: int32
                      type: integer
                  required:
                  - at
                  - document
                  - first
                  - unit
                  - units
                  type: object
                type: array
              finished:
                format: date-time
                type: string
              interrupted:
                format: int32
                type: integer
              interruptions:
                description: |-
                  Interruptions lists the most recent attempts the farm stopped (a
                  drain, an eviction, a preemption, a node going away): they spent no
                  retry and run again. Interrupted counts them all.
                items:
                  description: WorkInterruption is one attempt the farm stopped.
                  properties:
                    at:
                      format: date-time
                      type: string
                    node:
                      type: string
                    reason:
                      description: |-
                        Reason is the pod's DisruptionTarget reason (PreemptionByScheduler,
                        EvictionByEvictionAPI, DeletionByTaintManager, TerminationByKubelet,
                        DeletionByPodGC), or Deleted.
                      type: string
                    unit:
                      format: int32
                      type: integer
                  required:
                  - at
                  - reason
                  - unit
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              order:
                description: Order is the dispatch order over the unit axis.
                type: string
              output:
                description: |-
                  Output is the job's output view: every unit's captured changeset
                  folded in as the unit finishes.
                properties:
                  chain:
                    description: |-
                      Chain is the stored c4m chain: the job's input view, then one
                      section per fold, each sealed by the output view it produced.
                    type: string
                  changesets:
                    description: Changesets folded so far.
                    format: int32
                    type: integer
                  conflicts:
                    description: Conflicts lists paths two units wrote (the later
                      write is kept).
                    items:
                      type: string
                    type: array
                  provenance:
                    description: |-
                      Provenance is the C4 ID of the job's provenance index: for each file
                      the job wrote, the signed task record of the unit that wrote it.
                    type: string
                  record:
                    description: |-
                      Record is the C4 ID of the job record the queue signed when the job
                      ended: the output view, chain and index, and the decisions that
                      touched the job.
                    type: string
                  view:
                    description: View is the output after the latest fold.
                    type: string
                required:
                - chain
                - changesets
                - view
                type: object
              phase:
                description: Phase is Queued, Running, Blocked, Held, Succeeded or
                  Failed.
                type: string
              preemptions:
                description: Preemptions counts units stopped or asked to yield to
                  make room.
                format: int32
                type: integer
              rank:
                description: Rank is the job's position in dispatch order (1 is next).
                format: int32
                type: integer
              requeued:
                description: Requeued is the token of the last requeue request carried
                  out.
                type: string
              resume:
                additionalProperties:
                  type: string
                description: |-
                  Resume maps a unit index to the view its last yielded attempt
                  captured; the next attempt mounts that view and continues from its
                  checkpoint.
                type: object
              reviews:
                additionalProperties:
                  description: WorkReview is what reviews last decided for one unit.
                  properties:
                    by:
                      description: By is the review unit's index.
                      format: int32
                      type: integer
                    do:
                      description: Do is rework, escalate or accept.
                      type: string
                    note:
                      description: Note is an accepted unit's note.
                      type: string
                    passes:
                      description: Passes counts the unit's reworks.
                      format: int32
                      type: integer
                    to:
                      description: To is who an escalated unit waits for.
                      type: string
                    why:
                      type: string
                    with:
                      description: With is the rework's change to the unit's next
                        attempts.
                      properties:
                        avoidNodes:
                          items:
                            type: string
                          type: array
                        env:
                          additionalProperties:
                            type: string
                          type: object
                        fresh:
                          description: Fresh starts from the job's inputs, not from
                            the unit's last output.
                          type: boolean
                        image:
                          description: Image replaces the first container's image.
                          type: string
                        inputs:
                          description: Inputs are views mounted read-only (a counterexample,
                            a note).
                          items:
                            description: WorkReworkInput is a view a reworked unit
                              mounts.
                            properties:
                              mountPath:
                                type: string
                              view:
                                pattern: ^c4[1-9A-HJ-NP-Za-km-z]{88}$
                                type: string
                            required:
                            - mountPath
                            - view
                            type: object
                          type: array
                        memory:
                          description: Memory is the first container's memory request
                            and limit.
                          type: string
                        pool:
                          description: Pool is the only pool the unit may run in.
                          type: string
                      type: object
                  required:
                  - by
                  - do
                  type: object
                description: |-
                  Reviews maps the index of each unit a verdict did more than pass
                  (reworked, escalated, accepted with a note) to what it decided last.
                type: object
              started:
                description: Started and Finished bound the job's run.
                format: date-time
                type: string
              suggestion:
                description: Suggestion is the farm's suggested deadline and how it
                  got there.
                properties:
                  atRisk:
                    description: 'AtRisk: the job''s finish at Quantile is now after
                      the suggestion.'
                    type: boolean
                  deadline:
                    format: date-time
                    type: string
                  history:
                    description: History lists every value the suggestion took, oldest
                      first.
                    items:
                      description: WorkSuggestionRevision is one value a suggestion
                        took.
                      properties:
                        at:
                          format: date-time
                          type: string
                        deadline:
                          format: date-time
                          type: string
                        reason:
                          description: |-
                            Reason is first, or at-risk for a later move made because the
                            suggestion was at risk.
                          type: string
                        record:
                          description: Record is the C4 ID of the queue's signed record
                            of it.
                          type: string
                        unitsMeasured:
                          description: UnitsMeasured is how many units had finished.
                          format: int32
                          type: integer
                      required:
                      - at
                      - deadline
                      - unitsMeasured
                      type: object
                    type: array
                  maxRevisions:
                    format: int32
                    type: integer
                  nextSession:
                    description: |-
                      NextSession, for a sessions policy whose deadline the job is not
                      expected to make at Quantile, is the following session: the
                      one-click alternative.
                    format: date-time
                    type: string
                  policy:
                    description: |-
                      Policy names the deadline policy kind (achievable, sessions,
                      turnaround) and Quantile the finish percentile it meets.
                    type: string
                  quantile:
                    type: string
                  revisions:
                    format: int32
                    type: integer
                  state:
                    description: |-
                      State is Estimating (it may still move later if at risk) or
                      Settled.
                    type: string
                required:
                - deadline
                - policy
                - quantile
                - state
                type: object
              unitMillis:
                description: |-
                  UnitMillis is each finished unit's run time in milliseconds, by
                  index (0: not finished). Jobs above 50,000 units keep it in the
                  project store instead (DESIGN.md section 10.5).
                items:
                  format: int64
                  type: integer
                type: array
              unitOutputs:
                additionalProperties:
                  type: string
                description: |-
                  UnitOutputs maps the index of a unit another unit reads (fromUnit)
                  to its captured output view.
                type: object
              unitStates:
                additionalProperties:
                  type: string
                description: |-
                  UnitStates holds run-length index sets by state, each unit in one:
                  queued (or blocked), preflight (its pod is preparing: placement,
                  inputs, cache, image, license), running (the first attempt is
                  working), retrying (a later attempt is working), backoff (an attempt
                  failed and the next waits for a slot), egress (the work is done and
                  its output is being captured and added to the job's output),
                  succeeded (the output is added and recorded), failed (failed after
                  its retries: a person must act) and accepted (failed, and a person
                  accepted it, so nothing waits on it).
                type: object
              units:
                description: Units counts units by state.
                properties:
                  accepted:
                    format: int32
                    type: integer
                  backoff:
                    format: int32
                    type: integer
                  blocked:
                    format: int32
                    type: integer
                  egress:
                    format: int32
                    type: integer
                  failed:
                    format: int32
                    type: integer
                  flagged:
                    description: Flagged counts units a review escalated to a person.
                    format: int32
                    type: integer
                  held:
                    format: int32
                    type: integer
                  planned:
                    description: Planned counts generators not yet evaluated (DESIGN
                      10.6).
                    format: int32
                    type: integer
                  preflight:
                    format: int32
                    type: integer
                  queued:
                    format: int32
                    type: integer
                  retrying:
                    format: int32
                    type: integer
                  running:
                    format: int32
                    type: integer
                  succeeded:
                    format: int32
                    type: integer
                  total:
                    format: int32
                    type: integer
                  waits:
                    description: Waits counts wait units waiting for their decision.
                    format: int32
                    type: integer
                type: object
              verdicts:
                description: |-
                  Verdicts lists the most recent verdicts review units wrote, each
                  carried out once.
                items:
                  description: |-
                    WorkVerdict is one verdict a review unit wrote, carried out once for
                    that unit and attempt.
                  properties:
                    accepted:
                      format: int32
                      type: integer
                    at:
                      format: date-time
                      type: string
                    attempt:
                      format: int32
                      type: integer
                    document:
                      description: Document is the C4 ID of the verdict document.
                      type: string
                    error:
                      description: |-
                        Error says why the verdict was refused: nothing was done, and the
                        review unit failed.
                      type: string
                    escalated:
                      format: int32
                      type: integer
                    expanded:
                      format: int32
                      type: integer
                    passed:
                      description: Counts of the judged units by what was done.
                      format: int32
                      type: integer
                    pod:
                      description: 'Pod is the review pod''s UID: a pod''s verdict
                        is carried out once.'
                      type: string
                    record:
                      description: Record is the C4 ID of the queue's signed verdict
                        record.
                      type: string
                    reworked:
                      format: int32
                      type: integer
                    unit:
                      format: int32
                      type: integer
                    verdict:
                      description: |-
                        Verdict is the document's summary word: pass, rework, mixed,
                        escalate, flaky...
                      type: string
                  required:
                  - at
                  - attempt
                  - document
                  - unit
                  type: object
                type: array
              waits:
