                      type: string
                    weightedTokens:
                      format: int64
                      type: integer
                  type: object
                description: |-
                  ModelUsage maps each model unit's index to its token use and cost
                  over all its attempts.
                type: object
              needs:
                additionalProperties:
                  description: WorkNeeds is what a unit stopped for.
                  properties:
                    about:
                      description: |-
