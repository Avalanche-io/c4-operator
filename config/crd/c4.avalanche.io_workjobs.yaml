                    probe:
                      type: boolean
                    until:
                      format: date-time
                      type: string
                    why:
                      type: string
                  required:
                  - at
                  - until
                  - why
                  type: object
                description: UsageLimits are the units held for a model's usage limit,
                  by index.
                type: object
              verdicts:
                description: |-
                  Verdicts lists the most recent verdicts review units wrote, each
                  carried out once.
                items:
                  description: |-
                    WorkVerdict is one verdict a review unit wrote, carried out once for
                    that unit and attempt.
                  properties:
                    accepted:
                      format: int32
                      type: integer
                    at:
                      format: date-time
                      type: string
                    attempt:
                      format: int32
                      type: integer
                    document:
                      description: Document is the C4 ID of the verdict document.
                      type: string
                    error:
                      description: |-
                        Error says why the verdict was refused: nothing was done, and the
                        review unit failed.
                      type: string
                    escalated:
                      format: int32
                      type: integer
                    expanded:
                      format: int32
                      type: integer
                    passed:
                      description: Counts of the judged units by what was done.
                      format: int32
                      type: integer
                    pod:
                      description: 'Pod is the review pod''s UID: a pod''s verdict
                        is carried out once.'
                      type: string
                    record:
                      description: Record is the C4 ID of the queue's signed verdict
                        record.
                      type: string
                    reworked:
                      format: int32
                      type: integer
                    select:
                      description: |-
                        Select is the verdict's selection rule over the scores it judged:
                        "top 2", "threshold 0.8", "ucb 1.4 top 1".
                      type: string
                    superseded:
                      format: int32
                      type: integer
                    unit:
                      format: int32
                      type: integer
                    verdict:
                      description: |-
                        Verdict is the document's summary word: pass, rework, mixed,
                        escalate, flaky...
                      type: string
                  required:
                  - at
                  - attempt
                  - document
                  - unit
                  type: object
                type: array
              waits:
                description: |-
                  Waits are the job's waits, open and decided: its wait units, and
                  units a review escalated to a person.
                items:
                  description: |-
                    WorkWait is a unit that waits for someone or something: a person, an
                    outside party, or a clock. It holds no slot.
                  properties:
                    actor:
                      type: string
                    ask:
                      type: string
                    at:
                      format: date-time
                      type: string
                    block:
                      description: |-
                        Block says the unit opened the wait for itself at a safe point
                        (c4-unit wait): it stopped there, and runs again, resuming, once
                        the wait is decided. Safepoint is the safe point's number.
                      type: boolean
                    blocking:
                      description: 'Blocking: unfinished work waits on it.'
                      type: boolean
                    choices:
                      description: 'Choices are the decisions that complete it, besides
                        fail (none: any).'
                      items:
                        type: string
                      type: array
                    do:
                      description: The decision, once made.
                      type: string
                    escalated:
                      description: |-
                        Escalated: the unit is one a review escalated, waiting for a
                        person's decision on it.
                      type: boolean
                    expectSeconds:
                      description: |-
                        ExpectSeconds is how long it is expected to wait in all, from the
                        server's measured decisions in this job, else the unit's own figure.
                      format: int64
                      type: integer
                    name:
                      type: string
                    note:
                      type: string
                    record:
                      type: string
                    reply:
                      description: |-
                        Reply says the decision carries content; View is the reply, once
                        decided.
                      type: boolean
                    safepoint:
                      format: int32
                      type: integer
                    server:
                      description: |-
                        Server is who or what it waits for: person:<id>, party:<name> or
                        clock:<time>.
                      type: string
                    since:
                      description: 'Since is when it opened: every unit it runs after
                        was done.'
                      format: date-time
                      type: string
                    unit:
                      format: int32
                      type: integer
                    view:
                      type: string
                  required:
                  - server
                  - unit
                  type: object
                type: array
              withdrawn:
                description: |-
                  Withdrawn is the token of the last withdrawal carried out
                  (AnnotationWithdrawNeeds).
                type: string
              yields:
                description: Yields lists the most recent yields of checkpointing
                  units.
                items:
                  description: WorkYield is one yield of a checkpointing unit.
                  properties:
                    at:
                      format: date-time
                      type: string
                    reason:
                      type: string
                    unit:
                      format: int32
                      type: integer
                    view:
                      description: View is what the unit had saved when it stopped.
                      type: string
                  required:
                  - at
                  - reason
                  - unit
                  - view
                  type: object
                type: array
            type: object
        type: object
        x-kubernetes-validations:
        - message: a WorkJob name is at most 50 characters (it labels and prefixes
            its unit pods)
          rule: self.metadata.name.size() <= 50
        - message: a job's review is set when it is created
          rule: has(self.spec.review) == has(oldSelf.spec.review) && (!has(self.spec.review)
            || self.spec.review == oldSelf.spec.review)
        - message: 'a job is a forecast, or not, from when it is created: a real job
            replaces a forecast'
          rule: has(self.spec.forecast) == has(oldSelf.spec.forecast)
        - message: the tool a job runs under, and its networks, are set when it is
            created
          rule: has(self.spec.tool) == has(oldSelf.spec.tool) && (!has(self.spec.tool)
            || self.spec.tool == oldSelf.spec.tool)
    served: true
    storage: true
    subresources:
      status: {}
