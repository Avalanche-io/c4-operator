                    type: integer
                  modelWorkShare:
                    type: string
                  outputTokens:
                    format: int64
                    type: integer
                  proceduralSlotCost:
                    type: string
                  proceduralSlotHours:
                    type: string
                  proceduralUnits:
                    format: int32
                    type: integer
                  tokenCost:
