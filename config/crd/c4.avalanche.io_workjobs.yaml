                      type: string
                    inputTokens:
                      format: int64
                      type: integer
                    models:
                      items:
                        description: WorkModelTokens is one model's tokens in a unit.
                        properties:
                          cacheReadTokens:
                            format: int64
                            type: integer
                          cacheWriteTokens:
                            format: int64
                            type: integer
                          cost:
                            description: Cost of its priced tokens; absent when none
