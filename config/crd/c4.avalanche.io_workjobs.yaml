                        effort:
                          type: string
                        efforts:
                          items:
                            type: string
                          type: array
                        mcpServers:
                          items:
                            type: string
                          type: array
                        model:
                          type: string
                        models:
                          items:
                            type: string
                          type: array
                        thinking:
                          type: string
                        toolNames:
                          items:
                            type: string
                          type: array
                        tools:
                          type: string
                      type: object
                    slotCost:
