---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: workjobs.c4.avalanche.io
spec:
  group: c4.avalanche.io
  names:
    kind: WorkJob
    listKind: WorkJobList
    plural: workjobs
    shortNames:
    - wj
    singular: workjob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.class
      name: Class
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.units.succeeded
      name: Done
      type: integer
    - jsonPath: .status.units.total
      name: Total
      type: integer
    - jsonPath: .status.estimate.slackSeconds
      name: Slack
      type: integer
    - jsonPath: .status.rank
      name: Rank
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: WorkJob is a job in the farm's queue.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WorkJobSpec declares a job: its class, its units' parameters, its
              objective, where it may run, its inputs and outputs, and the pod each
              unit runs.
            properties:
              avoidNodes:
                description: |-
                  AvoidNodes are nodes a person took out of this job's use; the queue
                  adds nodes that failed its units NodeErrorLimit times.
                items:
                  type: string
                type: array
              class:
                description: 'Class names the work class: render, ci, ml, agent or
                  graph.'
                enum:
                - render
                - ci
                - ml
                - agent
                - graph
                type: string
              deadline:
                description: |-
                  Deadline is the job's own deadline. Without one, the class's
                  objective applies (a latency target from the time the job became
                  ready, or a default turnaround).
                format: date-time
                type: string
              deadlineMode:
                description: |-
                  DeadlineMode says who owns the deadline. Pinned: Deadline, set by a
                  person or a tool (the default when Deadline is set). Suggested: the
                  farm suggests one from the deadline policy (the project's, else the
                  class's), the job's estimate and the first units' measurements; it
                  revises the suggestion at most a few times and then settles it, and
                  never moves a settled one (the default when Deadline is not set and
                  the policy is not a latency SLO). Tracking: production tracking
                  writes Deadline; the farm never suggests one.
                enum:
                - Pinned
                - Suggested
                - Tracking
                type: string
              dependsOn:
                description: DependsOn names jobs in this namespace that must succeed
                  first.
                items:
                  type: string
                type: array
              follows:
                description: |-
                  Follows names the job in this namespace this one is the next
                  version of (v008 answers the notes on v007). The job record names
                  it, so lineage links the versions.
                type: string
              forecast:
                description: |-
                  Forecast makes the job a forecast only (DESIGN.md 10.12): work a
                  tracker expects (a shot not yet turned over, its bid) that the farm
                  plans for. It is estimated and placed among the real work, never
                  released: no pods, no quota, no burst capacity bought for it, and no
                  real job's ETA moves for it. It needs a deadline, its own or a
                  Milestone's. A real job replaces it when the work is submitted. A
                  job is a forecast, or not, from its creation; its size may change
                  as the bid does.
                properties:
                  exists:
                    description: |-
                      Exists is the chance it happens at all, 0 to 1 (default 1): it
                      weights the expected work.
                    pattern: ^(0(\.[0-9]+)?|1(\.0+)?)$
                    type: string
                  sd:
                    description: SD is the spread of SlotHours (default half of it).
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                  slotHours:
                    description: |-
                      SlotHours is its expected work; empty, the class plans it from the
                      job's params as it would the real job (frames, and the class's
                      prior).
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                  start:
                    description: |-
                      Start is the earliest it can begin (a turnover date): it is planned
                      to finish no earlier than Start and its own duration.
                    format: date-time
                    type: string
                  unitHours:
                    description: |-
                      UnitHours is how long one unit runs. With SlotHours it is the
                      longest unit, the critical path (default the class's recent unit
                      time in the project, else an hour; at most SlotHours); with the
                      class's plan, every unit's prior.
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                type: object
              inputs:
                description: Inputs are C4 views mounted into every unit.
                items:
                  description: |-
                    WorkInput mounts a view into every unit: a Materialization, or the
                    output view of another job in the namespace.
                  properties:
                    fromJob:
                      description: |-
                        FromJob mounts the output view of that job (in this namespace) once
                        it has succeeded. List it in dependsOn too.
                      type: string
                    materialization:
                      description: Materialization in the job's namespace.
                      type: string
                    mountPath:
                      description: MountPath in every container of the unit.
                      type: string
                    readOnly:
                      description: ReadOnly mounts without capture.
                      type: boolean
                  required:
                  - mountPath
                  type: object
                type: array
              maxParallel:
                description: 'MaxParallel caps the job''s running units (0: no cap).'
                format: int32
                type: integer
              measure:
                description: |-
                  Measure is the job's own measure of done (DESIGN.md 10.6): a number a
                  unit reports (.c4/measure.json, c4-unit measure), such as rules
                  sited of 379, shown as the job's progress.
                properties:
                  name:
                    description: Name is what is counted ("rules sited").
                    type: string
                  of:
                    description: Of is the target; a reading may carry its own.
                    format: int64
                    type: integer
                  required:
                    description: |-
                      Required: the job is done only when the measure reaches its target.
                      With its units finished short of it, the job needs a person.
                    type: boolean
                required:
                - name
                type: object
              nodeErrorLimit:
                default: 3
                description: |-
                  NodeErrorLimit blacklists a node for this job after this many unit
                  failures on it.
                format: int32
                type: integer
              nudge:
                description: Nudge holds or boosts the job. There are no priorities.
                properties:
                  boost:
                    description: |-
                      Boost multiplies the job's required slots, from 1 to 2, drawn from
                      its own project's quota first.
                    pattern: ^(1(\.[0-9]+)?|2(\.0+)?)$
                    type: string
                  hold:
                    description: Hold releases no new units; running units finish.
                    type: boolean
                  holdStop:
                    description: HoldStop holds and stops running units.
                    type: boolean
                type: object
              params:
                additionalProperties:
                  type: string
                description: |-
                  Params are the class's parameters, for example frames and chunk for
                  render, shards for ci, steps for ml.
                type: object
              pools:
                description: Pools the job's units may run in. Empty means the class's
                  defaults.
                items:
                  type: string
                type: array
              retries:
                default: 2
                description: 'Retries per unit after the first attempt: 0 for none.
                  Unset is 2.'
                format: int32
                type: integer
              review:
                description: |-
                  Review is a person's (or party's) review of the whole job's work:
                  a final wait, unit "@review", after every other unit, including
                  those expansions add later, so the job is Succeeded only once it is
                  decided ("done means approved", DESIGN.md 10.6). Any choice but
                  fail completes it; fail fails the job. Set at creation only.
                properties:
                  ask:
                    description: Ask is what the reviewer is asked.
                    type: string
                  choices:
                    description: Choices are the decisions it takes besides fail;
                      empty, approve.
                    items:
                      type: string
                    type: array
                  expectSeconds:
                    description: |-
                      ExpectSeconds is how long the review is expected to take, until the
                      farm has measured the reviewer's decisions.
                    format: int64
                    type: integer
                  server:
                    description: 'Server is who reviews: person:<id> or party:<name>.'
                    pattern: ^(person|party):.+$
                    type: string
                required:
                - server
                type: object
              template:
                description: |-
                  Template is the pod every unit runs. The queue adds the unit's
                  environment (C4_UNIT, and the class's variables), the pool's node
                  selector and tolerations, and the input volumes. The API server
                  validates it when the queue creates each pod; the CRD does not
                  repeat the pod schema (it would exceed what kubectl apply can carry).
                type: object
                x-kubernetes-preserve-unknown-fields: true
              tool:
                description: |-
                  Tool is the published tool the job's units run under: a tool job's
                  (POST /submissions, and a tool's test when it is published). Its
                  units are labelled with it and reach the networks it names and
                  nothing else; with none they are sealed (DESIGN.md 10.6, tools).
                properties:
                  name:
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  network:
                    description: |-
                      Network names the networks the units may reach, as the farm admin
                      defines them (the c4-networks ConfigMap in the operator's
                      namespace). Empty: the units are sealed. The queue holds the units
                      while it names one the version (View) does not declare.
                    items:
                      type: string
                    type: array
                  view:
                    description: |-
                      View is the version's tree (its C4 ID), as the Tool records it: the
                      version whose tool.yaml says which networks the job may claim.
                    type: string
                required:
                - name
                type: object
            required:
            - class
            - template
            type: object
          status:
            description: |-
              WorkJobStatus is the queue's view of a job. Per-unit state is kept as
              run-length index sets, so its size grows with state changes along the
              unit range, not with the number of units.
            properties:
              acked:
                description: |-
                  Acked is the token of the last acknowledgement request carried out
                  (AnnotationAcks).
                type: string
              acks:
                description: |-
                  Acks are the standing acknowledgements: who took, was assigned or
                  accepted which failed units, and when. A requeue clears a unit's.
                items:
                  description: WorkAck is a standing acknowledgement of failed units.
                  properties:
                    actor:
                      type: string
                    assignee:
                      type: string
                    at:
                      format: date-time
                      type: string
                    kind:
                      type: string
                    note:
                      type: string
                    record:
                      type: string
                    units:
                      type: string
                  required:
                  - actor
                  - at
                  - kind
                  - units
                  type: object
                type: array
              asks:
                description: |-
                  Asks are the latest questions the job's units asked one another,
                  and their answers.
                items:
                  description: |-
                    WorkAsk is a question one unit asked another (c4-unit ask), or a wait
                    unit asked the unit that serves it (Wait).
                  properties:
                    answer:
                      description: Answer, or Cannot and why, once answered.
                      type: string
                    answered:
                      format: date-time
                      type: string
                    at:
                      format: date-time
                      type: string
                    cannot:
                      type: string
                    from:
                      format: int32
                      type: integer
                    id:
                      description: ID is <asker unit>#<n>, or w<wait unit>.
                      type: string
                    needs:
                      description: |-
                        Needs: the question a unit stopped for (NeedsInformation), put to
                        the job's answerer; its answer supplies it.
                      type: boolean
                    text:
                      type: string
                    to:
                      description: To is the answering unit; -1 when none could.
                      format: int32
                      type: integer
                    wait:
                      type: boolean
                  required:
                  - at
                  - from
                  - id
                  - text
                  - to
                  type: object
                type: array
              attempts:
                description: |-
                  Attempts per unit index, for units tried more than once
                  ("index:attempts" pairs, comma-separated).
                type: string
              blacklist:
                description: Blacklist holds nodes this job will not use.
                items:
                  type: string
                type: array
              causes:
                description: |-
                  Causes are the job's failures and flags grouped by cause (an exit
                  signature, a node, a review's reason, information a brief lacked),
                  each with the units it touched and what the farm did, so people and
                  trackers see one item per cause rather than one per failure
                  (DESIGN.md 10.14). At most 16, the newest kept; CausesDropped
                  counts the rest.
                items:
                  description: WorkCause is one cause of a job's failures or flags.
                  properties:
                    count:
                      format: int32
                      type: integer
                    did:
                      description: |-
                        Did is what the farm did about it: retried, failed, blacklisted,
                        reworked, escalated, accepted (each once, in order).
                      items:
                        type: string
                      type: array
                    first:
                      format: date-time
                      type: string
                    key:
                      description: |-
                        Key names the cause within the job; it stays the same as the cause
                        grows.
                      type: string
                    kind:
                      description: |-
                        Kind is exit (a unit's process failed), node (a node failed units
                        up to the job's limit), verdict (a review reworked, escalated or
                        failed units) or needs (units need information their brief lacked).
                      type: string
                    last:
                      format: date-time
                      type: string
                    nodes:
                      description: Nodes it happened on, at most four.
                      items:
                        type: string
                      type: array
                    sample:
                      format: int32
                      type: integer
                    title:
                      description: Title says it in production's terms ("exit 137
                        OOMKilled").
                      type: string
                    to:
                      description: To is whom a review escalated it to.
                      type: string
                    units:
                      description: |-
                        Units is the set of units it touched ("0-9,14"); Count its attempts;
                        Sample one of them.
                      type: string
                  required:
                  - count
                  - first
                  - key
                  - kind
                  - last
                  - sample
                  - title
                  - units
                  type: object
                type: array
              causesDropped:
                format: int32
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deadline:
                description: Deadline is the effective deadline.
                format: date-time
                type: string
              deadlineSource:
                description: |-
                  DeadlineSource says where Deadline comes from: spec (Pinned or
                  Tracking), milestone (the earliest Milestone selecting the job),
                  suggested, or class (the class's objective).
                type: string
              decided:
                description: |-
                  Decided is the token of the last decision carried out
                  (AnnotationDecide).
                type: string
              decisions:
                description: |-
                  Decisions lists the most recent preemptions and yields the queue
                  decided for this job's units, each with its signed decision record.
                items:
                  description: |-
                    WorkDecision is one scheduling decision that stopped or asked a unit to
                    yield.
                  properties:
                    at:
                      format: date-time
                      type: string
                    for:
                      description: For is the job the slots went to, if any.
                      type: string
                    kind:
                      description: Kind is yield (stop at the next checkpoint) or
                        stop.
                      type: string
                    policy:
                      description: |-
                        Policy are the policy values that decided it, and where each came
                        from.
                      items:
                        description: |-
                          WorkPolicyUse is a policy value that decided something: its key, its
                          value, and where it came from (the farm's default, the job's Project,
                          the job).
                        properties:
                          from:
                            description: |-
                              WorkPolicyFrom is where a policy value came from. Note says why a value
                              asked for was not taken (a project's past the farm's limit).
                            properties:
                              note:
                                type: string
                              record:
                                type: string
                              ref:
                                type: string
                              scope:
                                description: Scope is farm, project, job or unit.
                                type: string
                              setBy:
                                type: string
                            required:
                            - scope
                            type: object
                          key:
                            type: string
                          value:
                            type: string
                        required:
                        - from
                        - key
                        - value
                        type: object
                      type: array
                    reason:
                      type: string
                    record:
                      description: Record is the C4 ID of the queue's signed decision
                        record.
                      type: string
                    unit:
                      format: int32
                      type: integer
                  required:
                  - at
                  - kind
                  - reason
                  - unit
                  type: object
                type: array
              derivation:
                description: |-
                  Derivation is the record of the job's process. Experimental: it
                  will change with C4's derivation-record design.
                properties:
                  class:
                    description: |-
                      Class is the class the record supports. An exact declaration reads
                      as validated once a re-run wrote a different output, or while its
                      pods are not sealed. Verified: an exact class has been confirmed by
                      re-runs that wrote the same output, which is what allows reusing an
                      output in place of moving it.
                    type: string
                  declared:
                    description: |-
                      Declared is the class the job declared (annotation
                      c4.avalanche.io/derivation-class): exact, validated or volatile.
                    type: string
                  matched:
                    description: |-
                      Matched and Mismatched count re-runs of the same process on the same
                      inputs that wrote the same output, or another.
                    format: int32
                    type: integer
                  mismatched:
                    format: int32
                    type: integer
                  program:
                    description: |-
                      Program is the ID of the program the job's units run: images,
                      command and parameters, without what tells one unit from another
                      (frames, shards). Evidence and class accrue to it.
                    type: string
                  verified:
                    type: boolean
                  why:
                    description: Why says why the class is not the declared one.
                    type: string
                required:
                - class
                - declared
                - program
                type: object
              estimate:
                description: Estimate is the remaining-work estimate and objective
                  state.
                properties:
                  atRisk:
                    type: boolean
                  attainableSlots:
                    type: string
                  calibrated:
                    description: |-
                      Calibrated says the percentiles come from finished jobs' outcomes
                      (live calibration), not from the estimator's own spread.
                    type: boolean
                  eta50:
                    description: |-
                      ETA50 and ETA90 are the finish a person is shown, at 50 and 90%:
                      the plan's finish with the calibrated percentiles of the remaining
                      work, and half the critical path as the last wave's tail (the
                      scheduler's own, more conservative finish is what it decides on).
                    format: date-time
                    type: string
                  eta80:
                    description: ETA80 and ETA95 complete the band.
                    format: date-time
                    type: string
                  eta90:
                    format: date-time
                    type: string
                  eta95:
                    format: date-time
                    type: string
                  feasible:
                    type: boolean
                  heavyRegions:
                    description: HeavyRegions are axis ranges well above the job's
                      median cost.
                    items:
                      description: HeavyRegion is a range of the unit axis that costs
                        more than the median.
                      properties:
                        factor:
                          type: string
                        from:
                          format: int32
                          type: integer
                        to:
                          format: int32
                          type: integer
                      required:
                      - factor
                      - from
                      - to
                      type: object
                    type: array
                  message:
                    type: string
                  p90RemainingSeconds:
                    format: int64
                    type: integer
                  remainingSeconds:
                    description: |-
                      RemainingSeconds is wall-clock time to the ETA (p50): the plan's
                      answer, after allocation.
                    format: int64
                    type: integer
                  remainingWork:
                    description: |-
                      RemainingWork is the estimated work left (W) and its 90th percentile
                      (W90), in slot-seconds: the estimator's answer, before allocation.
                    format: int64
                    type: integer
                  remainingWorkP90:
                    format: int64
                    type: integer
                  requiredSlots:
                    type: string
                  risk:
                    description: |-
                      Risk is the deadline risk a person is shown: none, atRisk (the
                      band at the job's quantile, 0.95 for a suggested deadline and 0.9
                      otherwise, ends after the deadline, or the scheduler's conservative
                      finish does), willMiss (late even with every slot it can get, or
                      the median finish is after the deadline) or missed (the deadline
                      has passed and the job is not finished).
                    type: string
                  runningSlots:
                    format: int32
                    type: integer
                  slackSeconds:
                    format: int64
                    type: integer
                type: object
              expansions:
                description: |-
                  Expansions lists every generator unit evaluated, in the order its
                  children were added: the unit table is the class's plan with these
                  applied, so a restart rebuilds it from the documents in the store
                  (DESIGN 10.6).
                items:
                  description: |-
                    WorkExpansion is one generator's evaluation: its expansion document
                    added Units children, indexes First to First+Units-1.
                  properties:
                    at:
                      format: date-time
                      type: string
                    document:
                      description: Document is the C4 ID of the expansion document.
                      type: string
                    error:
                      description: |-
                        Error says why the document was refused; it added no units and the
                        generator failed.
                      type: string
                    first:
                      format: int32
                      type: integer
                    record:
                      description: Record is the C4 ID of the queue's signed expansion
                        record.
                      type: string
                    unit:
                      format: int32
                      type: integer
                    units:
                      format: int32
                      type: integer
                  required:
                  - at
                  - document
                  - first
                  - unit
                  - units
                  type: object
                type: array
              finished:
                format: date-time
                type: string
              gates:
                description: 'Gates lists the job''s units at a gate: holding it,
                  or in its line.'
                items:
                  description: |-
                    WorkGateEntry is a unit at a gate: the holder (position 0) or a unit
                    waiting in line (1 is next).
                  properties:
                    expectStart:
                      description: ExpectStart is when the unit is expected to pass.
                      format: date-time
                      type: string
                    gate:
                      type: string
                    holder:
                      description: Holder is who holds the gate now, as job#unit.
                      type: string
                    name:
                      type: string
                    position:
                      format: int32
                      type: integer
                    since:
                      description: Since is when the unit joined the line.
                      format: date-time
                      type: string
                    unit:
                      format: int32
                      type: integer
                  required:
                  - gate
                  - position
                  - unit
                  type: object
                type: array
              holds:
                description: |-
                  Holds lists each unit holding claims that others wait on, with its
                  waiting line in dispatch order.
                items:
                  description: WorkHold is a unit holding claims, and the units locked
                    behind it.
                  properties:
                    holder:
                      format: int32
                      type: integer
                    name:
                      type: string
                    "on":
                      description: On are the holder's claims.
                      items:
                        type: string
                      type: array
                    waiting:
                      items:
                        description: WorkHoldWaiter is a unit locked behind a holder,
                          and its claim.
                        properties:
                          name:
                            type: string
                          "on":
                            type: string
                          unit:
                            format: int32
                            type: integer
                        required:
                        - unit
                        type: object
                      type: array
                  required:
                  - holder
                  type: object
                type: array
              inputSubstitutes:
                description: |-
