                            type: string
                          inputTokens:
                            format: int64
                            type: integer
                          model:
                            type: string
                          outputTokens:
                            format: int64
                            type: integer
                          unpriceable:
                            type: boolean
                          unpricedTokens:
                            format: int64
                            type: integer
                          unpricedWeightedTokens:
                            format: int64
                            type: integer
                          weightedTokens:
                            format: int64
                            type: integer
                        required:
                        - model
                        type: object
                      type: array
                    outputTokens:
                      format: int64
                      type: integer
                    reasoning:
                      description: |-
                        Reasoning is what the unit's latest attempt reasoned with, as its
