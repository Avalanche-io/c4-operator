                    suppliedAt:
                      format: date-time
                      type: string
                    suppliedRecord:
                      type: string
                    text:
                      description: Text is the information it needs, and Why why it
                        needs it.
                      type: string
                    why:
                      type: string
                    withdrawn:
                      description: |-
                        Withdrawn says who withdrew the question (the block on a re-check,
