---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: projects.c4.avalanche.io
spec:
  group: c4.avalanche.io
  names:
    kind: Project
    listKind: ProjectList
    plural: projects
    singular: project
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.isolation
      name: Isolation
      type: string
    - jsonPath: .spec.store.access
      name: Access
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Project is a unit of data isolation: its namespaces, its store and
          credentials, the trees it may use, and its share of the farm.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ProjectSpec defines a project.
            properties:
              grants:
                description: |-
                  Grants are the trees a Grants-scoped project may materialize, and
                  which paths of them.
                items:
                  description: Grant allows a project to use part of a tree in its
                    store.
                  properties:
                    paths:
                      description: |-
                        Paths limits the grant to these path patterns (Materialization
                        include syntax). Empty means the whole tree.
                      items:
                        type: string
                      type: array
                    tree:
                      description: |-
                        Tree is the ID of a view, root record, source c4m, or changeset base
                        the project may materialize.
                      pattern: ^c4[1-9A-HJ-NP-Za-km-z]{88}$
                      type: string
                  required:
                  - tree
                  type: object
                type: array
              importers:
                description: |-
                  Importers are the service accounts that sign the project's import
                  and ingest records (c4-operator import-git, ingest): the farm's
                  certificate issuer certifies a workload only if a project names it
                  here, in one of the project's namespaces. Any other workload's
                  token is refused a certificate.
                items:
                  description: |-
                    Importer names a service account that signs a project's import and
                    ingest records.
                  properties:
                    namespace:
                      description: Namespace is one of the project's namespaces.
                      maxLength: 63
                      minLength: 1
                      type: string
                    serviceAccount:
                      description: ServiceAccount is the account's name.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - namespace
                  - serviceAccount
                  type: object
                maxItems: 64
                type: array
              isolation:
                default: Strict
                description: Isolation modes.
                enum:
                - Strict
                - Shared
                type: string
              namespaces:
                description: |-
                  Namespaces whose Materializations belong to this project. A
                  namespace belongs to at most one project.
                items:
                  maxLength: 63
                  type: string
                maxItems: 256
                minItems: 1
                type: array
              root:
                description: |-
                  Root is where the project's trees mount in its units: the tree a
                  submission names, and the outputs of the jobs it follows. A clean
                  absolute path; unset, /show (DefaultProjectRoot).
                pattern: ^/([A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*)?$
                type: string
                x-kubernetes-validations:
                - message: a project root is a clean path, without . or ..
                  rule: '!(self + ''/'').contains(''/./'') && !(self + ''/'').contains(''/../'')'
              scope:
                default: Store
                description: |-
                  Scope is Store (anything in the project's own store) or Grants
                  (only what Grants lists). Listing grants requires scope Grants.
                enum:
                - Store
                - Grants
                type: string
              sharingGroup:
                description: SharingGroup names the group a Shared project shares
                  caches with.
                type: string
              store:
                description: ProjectStore is where a project's content lives.
                properties:
                  access:
                    default: Tiered
                    description: Access selects tiered or direct reads.
                    enum:
                    - Tiered
                    - Direct
                    type: string
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef names a Secret in the operator's namespace with
                      AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Users of the project's
                      namespaces can neither read nor choose it.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  shards:
                    description: |-
                      Shards hold the project's objects. An object lives on the shard
                      whose name has the highest rendezvous score for its ID, so no one
                      endpoint carries every read, adding a shard moves about 1/(n+1) of
                      the objects, and moving a shard to a new URL moves none.
                    items:
                      description: StoreShard is one shard of a project's store.
                      properties:
                        name:
                          description: |-
                            Name is the shard's stable identity; placement depends on it, not on
                            the URL.
                          minLength: 1
                          type: string
                        url:
                          description: |-
                            URL in C4_STORE form: s3://bucket/prefix?region=..&endpoint=..,
                            c4d://host:port, or http(s)://host:port.
                          minLength: 1
                          type: string
                      required:
                      - name
                      - url
                      type: object
                    minItems: 1
                    type: array
                  verifyFill:
                    description: |-
                      VerifyFill rehashes objects as node caches fill. Off by default:
                      bytes are verified once, when they enter the store.
                    type: boolean
                required:
                - shards
                type: object
              work:
                description: Work configures the project's share of the farm (P5).
                properties:
                  burstBudgetPerDay:
                    description: |-
                      BurstBudgetPerDay caps automatic burst spending, in the pools'
                      currency.
                    type: string
                  deadlinePolicies:
                    description: |-
                      DeadlinePolicies override the class's deadline policy for this
                      project's jobs, one per class.
                    items:
                      description: |-
                        DeadlinePolicy chooses the deadlines the farm suggests for a class's
                        jobs that have none of their own.
                      properties:
                        class:
                          description: Class is the work class the policy applies
                            to.
                          type: string
                        kind:
                          description: |-
                            Kind: achievable (the earliest time the job can finish at Quantile
                            without making another job late, rounded up), sessions (the next of
                            a calendar of review sessions; a job not expected to make it keeps
                            it and is offered the following one), or turnaround (submission
                            plus Turnaround).
                          enum:
                          - achievable
                          - sessions
                          - turnaround
                          type: string
                        maxRevisions:
                          description: |-
                            MaxRevisions caps how often a suggestion moves before it settles
                            (default 2).
                          format: int32
                          type: integer
                        minLead:
                          type: string
                        quantile:
                          description: |-
                            Quantile is the finish percentile a suggestion must meet, "0.95" by
                            default (forecast.DefaultQuantile); a lower one, such as "0.8",
                            suggests earlier deadlines that are missed more often.
                          type: string
                        round:
                          description: Round ("15m") and MinLead ("15m") shape achievable
                            deadlines.
                          type: string
                        sessions:
                          description: |-
                            Sessions are times of day, "HH:MM", in TimeZone, on Weekdays
                            ("Mon".."Sun"; every day when empty).
                          items:
                            type: string
                          type: array
                        timeZone:
                          description: TimeZone is an IANA zone name (default UTC).
                          type: string
                        turnaround:
                          description: Turnaround is a duration ("24h") for kind turnaround.
                          type: string
                        weekdays:
                          items:
                            type: string
                          type: array
                      required:
                      - class
                      - kind
                      type: object
                    type: array
                  dueTime:
                    description: |-
                      DueTime is the time of day a date-only due date means (most
                      trackers keep dates): 18:00 UTC when unset.
                    properties:
                      at:
                        description: At is a time of day, "HH:MM".
                        pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                        type: string
                      timeZone:
                        description: TimeZone is an IANA zone name (default UTC).
                        type: string
                    required:
                    - at
                    type: object
                  escalation:
                    description: |-
                      Escalation sets, for the project's jobs, when a unit's question to
                      a person turns pressing and how its block may re-check it (the
                      farm's defaults otherwise; a job may only tighten them).
                    properties:
                      pressAfter:
                        description: 'PressAfter: an escalation open this long is
                          pressing (2h).'
                        type: string
                      pressMargin:
                        description: |-
                          PressMargin: an escalation is pressing this long before the time an
                          answer can come with the job still on time (15m).
                        type: string
                      recheck:
                        description: ProjectRecheck is how often a block may re-check
                          its question.
                        properties:
                          max:
                            description: Max re-checks of one question (5).
                            format: int32
                            minimum: 0
                            type: integer
                          minInterval:
                            description: MinInterval between two re-checks (10m).
                            type: string
                        type: object
                    type: object
                  fairShareWeight:
                    description: FairShareWeight scales the project's share of free
                      capacity.
                    type: string
                  lateCostPerHour:
                    description: |-
                      LateCostPerHour prices an hour of lateness, so the scheduler can
                      weigh a burst against the lateness it prevents.
                    type: string
                  policy:
                    description: |-
                      Policy sets the project's values of the farm's policy keys (such
                      as decide.standIn), within the limits the farm sets.
                    properties:
                      values:
                        additionalProperties:
                          type: string
                        description: Values by key. A value the farm's limit does
                          not allow is ignored.
                        type: object
                    type: object
                  quotas:
                    description: |-
                      Quotas per pool, with Kueue's semantics: nominal slots are
                      guaranteed when the pool is contended; unused nominal slots are lent
                      to others; up to BorrowingLimit slots may be borrowed.
                    items:
                      description: Quota is a project's entitlement in one pool.
                      properties:
                        borrowingLimit:
                          format: int32
                          minimum: 0
                          type: integer
                        nominal:
                          format: int32
                          minimum: 0
                          type: integer
                        pool:
                          type: string
                      required:
                      - nominal
                      - pool
                      type: object
                    type: array
                  shareHistory:
                    description: |-
                      ShareHistory says whether the project's finished jobs may inform
                      other projects' estimates. "none" (the default) keeps the project's
                      history to itself. "aggregate" adds its calibration scores to a
                      farm-wide pool per class, which every opted-in project consults
                      behind its own, and only once at least three projects contribute.
                      Scores carry no names, inputs or C4 IDs.
                    enum:
                    - none
                    - aggregate
                    type: string
                type: object
            required:
            - namespaces
            - store
            type: object
            x-kubernetes-validations:
            - message: an importer is a service account in one of the project's namespaces
              rule: '!has(self.importers) || self.importers.all(i, i.namespace in
                self.namespaces)'
          status:
            description: ProjectStatus reports validation.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
