---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: trackerlinks.c4.avalanche.io
spec:
  group: c4.avalanche.io
  names:
    kind: TrackerLink
    listKind: TrackerLinkList
    plural: trackerlinks
    singular: trackerlink
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tracker
      name: Tracker
      type: string
    - jsonPath: .spec.ref.url
      name: Ref
      type: string
    - jsonPath: .spec.target.workJob
      name: Job
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TrackerLink binds one tracker entity to one C4 object.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TrackerLinkSpec names the two ends.
            properties:
              intake:
                description: Intake is the index of the Tracker intake rule that made
                  the link.
                format: int32
                type: integer
              ref:
                description: Ref is the tracker entity.
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  url:
                    type: string
                required:
                - id
                - type
                type: object
              target:
                description: 'Target is the C4 object: exactly one of its fields.'
                properties:
                  milestone:
                    type: string
                  workJob:
                    type: string
                type: object
              tracker:
                description: Tracker is the Tracker in this namespace.
                type: string
            required:
            - ref
            - target
            - tracker
            type: object
          status:
            description: TrackerLinkStatus is what c4-sync last read and wrote.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              decisions:
                description: Decisions are the tracker decisions relayed to C4, newest
                  last.
                items:
                  description: TrackerDecision is one tracker decision relayed to
                    C4.
                  properties:
                    at:
                      format: date-time
                      type: string
                    by:
                      description: By is the tracker user who decided.
                      type: string
                    do:
                      description: Do is what C4 was asked to decide.
                      type: string
                    error:
                      description: Error says why it was not relayed.
                      type: string
                    note:
                      description: |-
                        Note is the decision's text (a reviewer's note), up to 4 KiB; the
                        whole of it is in the evidence C4 stored.
                      type: string
                    source:
                      description: Source is the tracker entity that carries it (a
                        review, an action).
                      type: string
                    unit:
                      description: Unit is the wait it served.
                      type: string
                  required:
                  - at
                  - by
                  - do
                  - source
                  - unit
                  type: object
                type: array
              externalVersion:
                description: ExternalVersion is the entity's version (updatedAt, etag)
                  last read.
                type: string
              review:
                description: |-
                  Review is the entity under review for this link, once there is one
                  (github: the pull request).
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  url:
                    type: string
                required:
                - id
                - type
                type: object
              reviewHead:
                description: |-
                  ReviewHead is the head commit of the entity under review as last
                  read; it is read again only when the tracker reports a change, or
                  at a resync.
                type: string
              state:
                description: |-
                  State is the job's summary state as last written
                  (integrations MAPPING section 2).
                type: string
              versions:
                description: |-
                  Versions are the jobs this link served before its current one,
                  oldest first (a rework that made a next version).
                items:
                  type: string
                type: array
              written:
                additionalProperties:
                  description: TrackerWritten is one field c4-sync wrote.
                  properties:
                    at:
                      format: date-time
                      type: string
                    ref:
                      description: |-
                        Ref is the tracker entity the write made or changed, when it made
                        one (a check run, a comment).
                      type: string
                    value:
                      description: Value is a fingerprint of what was written.
                      type: string
                  required:
                  - at
                  - value
                  type: object
                description: |-
                  Written holds what c4-sync last wrote, by field, so it neither
                  repeats a write nor mistakes its own write for a person's.
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
