---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: tools.c4.avalanche.io
spec:
  group: c4.avalanche.io
  names:
    kind: Tool
    listKind: ToolList
    plural: tools
    singular: tool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .status.kind
      name: Kind
      type: string
    - jsonPath: .spec.view
      name: View
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Tool is what a unit works with beyond its image: a configuration
          (MCP server definitions, settings, skills, plugins) as a view, and what
          the unit may reach on the network (DESIGN 10.6, tools). A unit
          names one in its reasoning.tools; the queue looks for it in the job's
          namespace, then in the operator's, where the farm's defaults live. The
          view is mounted read-only at $C4_TOOLS, and its C4 ID is in the unit's
          record, so a unit's record says exactly what it ran with. Egress is an
          allow-list: a unit with a tool reaches what the tool lists and
          nothing else, and with none it is sealed.

          A Tool whose tree has a tool.yaml at its root is a published tool
          (c4: tool/1, the HUD's POST /tools): its status records each version
          published and its test on the farm, and spec.view is the latest version
          whose test passed. One without is an agent's configuration.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ToolSpec is a tool's configuration and egress.
            properties:
              c4:
                description: |-
                  C4 is what the unit may do with c4 itself, through the HUD (and so
                  MCP): read (see its project), job (also act on its own job: decide
                  its waits, steer, nudge) or project (also submit jobs in its
                  project). Empty: nothing. The unit holds a token for its pod alone,
                  at $C4_HUD_TOKEN_FILE, and every control it makes is in the book
                  under its name.
                enum:
                - read
                - job
                - project
                type: string
              egress:
                description: |-
                  Egress is what a unit with the tool may reach. With any rule,
                  the cluster's DNS is reachable too; with none, nothing is.
                items:
                  description: |-
                    ToolEgress is one destination a tool allows: a host, an address
                    block or a cluster service, optionally on some ports. Hosts are reached
                    through the farm's egress proxy; the others directly.
                  properties:
                    cidr:
                      description: CIDR is an address block, as 203.0.113.0/24.
                      type: string
                    host:
                      description: Host is a host name, or *.domain for the names
                        under domain.
                      type: string
                    ports:
                      description: Ports limits the rule to these TCP ports.
                      items:
                        format: int32
                        type: integer
                      type: array
                    service:
                      description: |-
                        Service is a cluster service, <namespace>/<name>: the pods it
                        selects.
                      type: string
                  type: object
                type: array
              sidecars:
                description: |-
                  Sidecars are servers that run beside the unit for its whole run
                  (MCP servers, a headless browser), each told to the unit as
                  $C4_TOOL_<NAME>, http://localhost:<port>. They share the unit's
                  network, so its egress is theirs.
                items:
                  description: ToolSidecar is one server a tool runs beside its units.
                  properties:
                    args:
                      items:
                        type: string
                      type: array
                    env:
                      additionalProperties:
                        type: string
                      type: object
                    image:
                      type: string
                    name:
                      description: Name names the container and the unit's $C4_TOOL_<NAME>.
                      type: string
                    port:
                      description: Port is where it listens on localhost.
                      format: int32
                      type: integer
                  required:
                  - image
                  - name
                  - port
                  type: object
                type: array
              view:
                description: |-
                  View is the configuration, a view's C4 ID, mounted read-only at
                  /etc/c4/tools ($C4_TOOLS).
                type: string
            type: object
          status:
            description: |-
              ToolStatus is what publishing a tool recorded: the version in use, what
              its tool.yaml says of itself, and every version published, newest last.
            properties:
              image:
                description: Image is the unit image at Version, pinned by digest
                  (tool.lock).
                type: string
              kind:
                type: string
              summary:
                type: string
              title:
                description: Title, Summary and Kind are the tool.yaml's, at Version.
                type: string
              version:
                description: |-
                  Version is the published version in use (v<N>): the latest whose
                  test passed, whose tree is spec.view. Empty until one passes.
                type: string
              versions:
                description: |-
                  Versions are the versions published, newest last (at most
                  MaxToolVersions), whether their tests passed or not.
                items:
                  description: ToolVersion is one publish of a tool.
                  properties:
                    at:
                      format: date-time
                      type: string
                    by:
                      description: By is who published it, and At when.
                      type: string
                    image:
                      description: Image is the unit image, pinned by digest.
                      type: string
                    kind:
                      type: string
                    summary:
                      type: string
                    test:
                      description: Test is the version's test on the farm.
                      properties:
                        job:
                          description: |-
                            Job is the test job, <namespace>/<name>; empty for a tool with no
                            test, which passes at once.
                          type: string
                        reason:
                          description: Reason says why it failed.
                          type: string
                        seconds:
                          description: Seconds is how long the test took, once it
                            ended.
                          format: int64
                          type: integer
                        state:
                          description: State is running, ok or failed.
                          enum:
                          - running
                          - ok
                          - failed
                          type: string
                        testedIn:
                          description: |-
                            TestedIn is the release whose own tests ran the version, for the
                            tools a release ships (published by c4 farm up from the folders it
                            embeds): the farm ran no test of its own, and State is ok.
                          type: string
                      required:
                      - state
                      type: object
                    title:
                      description: Title, Summary and Kind are the version's tool.yaml's.
                      type: string
                    version:
                      description: Version is v<N>, counted per tool in its namespace.
                      type: string
                    view:
                      description: 'View is the published tree: the folder with tool.lock.'
                      type: string
                  required:
                  - at
                  - by
                  - test
                  - version
                  - view
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
