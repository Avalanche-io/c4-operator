---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: capacityrequests.c4.avalanche.io
spec:
  group: c4.avalanche.io
  names:
    kind: CapacityRequest
    listKind: CapacityRequestList
    plural: capacityrequests
    singular: capacityrequest
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.pool
      name: Pool
      type: string
    - jsonPath: .spec.slots
      name: Slots
      type: integer
    - jsonPath: .status.state
      name: State
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CapacityRequest asks for burst capacity.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CapacityRequestSpec is the scheduler's request for burst capacity in one
              pool: the explicit interface between the queue and whatever provisions
              nodes.
            properties:
              approved:
                description: |-
                  Approved is set by a person for requests over budget, or by the
                  scheduler for automatic ones.
                type: boolean
              estimatedCost:
                description: EstimatedCost in US dollars.
                type: string
              jobs:
                items:
                  type: string
                type: array
              pool:
                type: string
              prewarmViews:
                description: PrewarmViews are views new nodes fetch before units land
                  on them.
                items:
                  type: string
                type: array
              reason:
                description: Reason in the farm's terms, and the jobs it is for.
                type: string
              slots:
                description: Slots wanted from the pool's burst capacity, in total.
                format: int32
                type: integer
              until:
                description: Until is when the capacity is expected to be needed to.
                format: date-time
                type: string
            required:
            - pool
            - reason
            - slots
            type: object
          status:
            description: CapacityRequestStatus reports fulfilment.
            properties:
              message:
                type: string
              provisionedSlots:
                description: ProvisionedSlots are ready.
                format: int32
                type: integer
              state:
                description: State is PendingApproval, Provisioning or Provisioned.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
