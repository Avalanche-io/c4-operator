---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: credentialleases.c4.avalanche.io
spec:
  group: c4.avalanche.io
  names:
    kind: CredentialLease
    listKind: CredentialLeaseList
    plural: credentialleases
    shortNames:
    - lease
    singular: credentiallease
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.holder
      name: Holder
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CredentialLease is a model credential's lease.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CredentialLeaseSpec is the lease.
            properties:
              account:
                description: |-
                  Account names the model account it serves (the ModelAccount, when
                  there is one), e.g. "anthropic-max".
                type: string
              boundTo:
                description: 'BoundTo is the work it may serve: only the holder''s
                  own.'
                properties:
                  owners:
                    description: |-
                      Owners are the identities (a WorkJob's c4.avalanche.io/owner) whose
                      jobs are the holder's own.
                    items:
                      type: string
                    type: array
                required:
                - owners
                type: object
              holder:
                description: Holder is the person the credential belongs to.
                type: string
              mode:
                description: Mode is how the credential reaches the farm.
                enum:
                - transfer
                - resident
                - holder-transfer
                type: string
              renewBefore:
                description: |-
                  RenewBefore is how long before the credential's expiry the holder's
                  agent renews it.
                type: string
              target:
                description: Target is where it may be mounted.
                properties:
                  pools:
                    description: |-
                      Pools are the pools whose unit pods may mount it; in other pools a
                      pod runs without it.
                    items:
                      type: string
                    type: array
                required:
                - pools
                type: object
              ttl:
                description: TTL is the lease's life from its creation.
                type: string
            required:
            - account
            - boundTo
            - holder
            - mode
            - renewBefore
            - target
            - ttl
            type: object
          status:
            description: CredentialLeaseStatus is the lease as it stands.
            properties:
              expiresAt:
                description: |-
                  ExpiresAt is when the credential or the lease ends, whichever is
                  first.
                format: date-time
                type: string
              message:
                description: Message says why, in plain words.
                type: string
              renewedAt:
