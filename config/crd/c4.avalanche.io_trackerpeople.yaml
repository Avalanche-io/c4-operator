---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: trackerpeople.c4.avalanche.io
spec:
  group: c4.avalanche.io
  names:
    kind: TrackerPerson
    listKind: TrackerPersonList
    plural: trackerpeople
    singular: trackerperson
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tracker
      name: Tracker
      type: string
    - jsonPath: .spec.login
      name: Login
      type: string
    - jsonPath: .spec.person
      name: Person
      type: string
    - jsonPath: .spec.revoked.at
      name: Revoked
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A TrackerPerson is one entry of a Tracker's people map, confirmed: a
          person's own word that a tracker login is them, so a decision that login
          makes in the tracker is relayed as theirs (internal/hud/API.md, People).
          The Tracker's spec.people offers the mapping (the project's word);
          it counts once the person it names accepts it, as themselves, in the
          HUD, which signs the offer and the acceptance as one control record.
          For a party (party:<name>), a member of the party accepts.

          People never write one. The HUD is the only writer (the c4-tracker-people
          policy). A revoked or replaced entry is kept, marked, for the trail.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TrackerPersonSpec is which login of which Tracker is whom, who offered
              it, who accepted it, and whether it still stands.
            properties:
              accepted:
                description: |-
                  Accepted is the person's (or party member's) acceptance, with the
                  control record that signs offer and acceptance together.
                properties:
                  at:
                    format: date-time
                    type: string
                  by:
                    type: string
                  record:
                    type: string
                required:
                - at
                - by
                type: object
              login:
                description: Login is the tracker user, as the Tracker's people map
                  keys it.
                type: string
              offer:
                description: |-
                  Offer is where the mapping came from: the Tracker's spec.people, at
                  its generation.
                properties:
                  from:
                    description: 'From is what offered it: spec.people.'
                    type: string
                  generation:
                    description: Generation is the Tracker's generation the offer
                      was read at.
                    format: int64
                    type: integer
                required:
                - from
                - generation
                type: object
              person:
                description: Person is the C4 person, or party:<name>, the login is.
                type: string
              revoked:
                description: |-
                  Revoked is set when the person, a party member or a project admin
                  took it back, or a later acceptance for the same login replaced it.
                properties:
                  at:
                    format: date-time
                    type: string
                  by:
                    type: string
                  record:
                    type: string
                required:
                - at
                - by
                type: object
              tracker:
                description: Tracker is the Tracker in this namespace.
                type: string
            required:
            - accepted
            - login
            - offer
            - person
            - tracker
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
