---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: materializations.c4.avalanche.io
spec:
  group: c4.avalanche.io
  names:
    kind: Materialization
    listKind: MaterializationList
    plural: materializations
    shortNames:
    - mat
    singular: materialization
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.project
      name: Project
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.files
      name: Files
      type: integer
    - jsonPath: .status.bytes
      name: Bytes
      type: integer
    - jsonPath: .status.viewID
      name: View
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Materialization is a tree, by C4 ID, that pods mount through the c4 CSI
          driver.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MaterializationSpec declares the tree a pod needs. The store and its
              credentials come from the Project that owns the namespace.
            properties:
              include:
                description: |-
                  Include limits the tree to these paths (sparse materialization).
                  Each pattern matches a path or any of its ancestors, component by
                  component, with path.Match. Empty means the whole tree. A project's
                  grant paths further limit it.
                items:
                  type: string
                type: array
              retainOnNode:
                description: |-
                  RetainOnNode keeps the view's layers on a node for this long after
                  the last volume using them is unmounted.
                type: string
              source:
                description: Source of the description.
                properties:
                  configMapKeyRef:
                    description: |-
                      ConfigMapKeyRef selects a ConfigMap key holding c4m text, in the
                      Materialization's namespace.
                    properties:
                      key:
                        description: |-
                          The key to select from the ConfigMap's Data field.
                          Keys in the BinaryData field are not currently propagated to container env vars.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the ConfigMap or its key must
                          be defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  id:
                    description: |-
                      ID is the C4 ID of a description in the project's store: a c4m file,
                      a view or snapshot root record, or a changeset (a c4m whose first
                      line names its parent). A changeset resolves to a chain of views that
                      nodes can mount as stacked layers.
                    pattern: ^c4[1-9A-HJ-NP-Za-km-z]{88}$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: set exactly one of configMapKeyRef or id
                  rule: has(self.configMapKeyRef) != has(self.id)
            required:
            - source
            type: object
          status:
            description: |-
              MaterializationStatus is written by the controller only, once per
              generation. Per-node behavior is exported as metrics, not here.
            properties:
              bytes:
                format: int64
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dirs:
                format: int64
                type: integer
              files:
                format: int64
                type: integer
              layers:
                description: |-
                  Layers are the view IDs of the source's changeset chain, base first.
                  The last is ViewID. Nodes use them as candidates to stack on.
                items:
                  type: string
                type: array
              missing:
                description: Missing counts unique objects the store does not have.
                format: int64
                type: integer
              missingPaths:
                items:
                  type: string
                type: array
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              project:
                description: Project that owns this Materialization's namespace.
                type: string
              projectGeneration:
                description: |-
                  ProjectGeneration is the generation of the Project the status was
                  resolved under; a change to the Project's store or grants resolves
                  again.
                format: int64
                type: integer
              record:
                description: |-
                  Record is the C4 ID of the resolution record the controller signed:
                  which view this resolved to, under which grant, with every object
                  present (DESIGN.md section 9.2).
                type: string
              rootID:
                description: |-
                  RootID is the ID of the top description's root listing as recorded
                  (the snapshot ID).
                type: string
              sourceID:
                description: SourceID identifies the exact description resolved.
                type: string
              sourceRecord:
                description: |-
                  SourceRecord is the verified record of where the source came from
                  (an import or ingest), named by the annotation
                  c4.avalanche.io/source-record.
                type: string
              uniqueBytes:
                format: int64
                type: integer
              uniqueObjects:
                description: UniqueObjects and UniqueBytes are what a cold node fetches.
                format: int64
                type: integer
              viewID:
                description: ViewID is the ID of the tree pods see.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
