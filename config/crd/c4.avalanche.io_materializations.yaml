---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: materializations.c4.avalanche.io
spec:
  group: c4.avalanche.io
  names:
    kind: Materialization
    listKind: MaterializationList
    plural: materializations
    shortNames:
    - mat
    singular: materialization
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.files
      name: Files
      type: integer
    - jsonPath: .status.bytes
      name: Bytes
      type: integer
    - jsonPath: .status.uniqueBytes
      name: Unique
      type: integer
    - jsonPath: .status.viewID
      name: View
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Materialization declares a content-addressed tree that pods mount.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MaterializationSpec declares the tree a pod needs.
            properties:
              include:
                description: |-
                  Include limits the tree to these paths (sparse materialization).
                  Each pattern matches a path or any of its ancestors, component by
                  component, with path.Match. Empty means the whole tree.
                items:
                  type: string
                type: array
              retainOnNode:
                description: |-
                  RetainOnNode pins the materialized tree on a node for this long
                  after the last pod using it ends. Unpinned trees stay cached until
                  the node needs the space.
                type: string
              source:
                description: Source of the c4m file.
                properties:
                  configMapKeyRef:
                    description: ConfigMapKeyRef selects a ConfigMap key holding c4m
                      text.
                    properties:
                      key:
                        description: |-
                          The key to select from the ConfigMap's Data field.
                          Keys in the BinaryData field are not currently propagated to container env vars.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the ConfigMap or its key must
                          be defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  id:
                    description: ID is the C4 ID of a c4m file (or a `c4 id -s` snapshot)
                      in the store.
                    pattern: ^c4[1-9A-HJ-NP-Za-km-z]{88}$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: set exactly one of configMapKeyRef or id
                  rule: has(self.configMapKeyRef) != has(self.id)
              store:
                description: |-
                  Store holding the content, in C4_STORE form: s3://bucket/prefix?region=..&endpoint=..,
                  a c4d endpoint (http://, https://, c4d://), or an absolute path on the node.
                minLength: 1
                type: string
              storeSecretRef:
                description: |-
                  StoreSecretRef names a Secret with S3 credentials, under the keys
                  AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (or access-key-id /
                  secret-access-key, as the c4 container examples use).
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              verify:
                default: Stat
                description: Verify selects how cached content is checked before use.
                enum:
                - Stat
                - Full
                type: string
            required:
            - source
            - store
            type: object
          status:
            description: MaterializationStatus reports the resolved tree and how nodes
              served it.
            properties:
              bytes:
                format: int64
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              files:
                description: Files and Bytes in the tree; duplicates count each time.
                format: int64
                type: integer
              missing:
                description: Missing counts unique objects the store does not have.
                format: int64
                type: integer
              missingPaths:
                description: MissingPaths samples paths whose content is missing.
                items:
                  type: string
                type: array
              nodes:
                description: Nodes reports per-node cache behavior.
                items:
                  description: NodeCacheStatus is one node's account of serving this
                    Materialization.
                  properties:
                    bytesFetched:
                      description: BytesFetched is what this node read from the store.
                      format: int64
                      type: integer
                    bytesMaterialized:
                      description: BytesMaterialized is what pods on this node were
                        given.
                      format: int64
                      type: integer
                    hits:
                      description: Hits counts objects already cached and valid.
                      format: int64
                      type: integer
                    lastError:
                      description: LastError is the most recent failure on this node,
                        cleared on success.
                      type: string
                    lastReadyMillis:
                      description: LastReadyMillis is how long the most recent request
                        took.
                      format: int64
                      type: integer
                    lastRequest:
                      description: LastRequest is when the most recent request finished.
                      format: date-time
                      type: string
                    misses:
                      description: Misses counts objects fetched from the store.
                      format: int64
                      type: integer
                    node:
                      type: string
                    refetched:
                      description: Refetched counts cached objects that failed verification
                        and were replaced.
                      format: int64
                      type: integer
                    requests:
                      description: Requests is how many pods asked this node for the
                        tree.
                      format: int64
                      type: integer
                    viewID:
                      description: ViewID last materialized on this node.
                      type: string
                  required:
                  - bytesFetched
                  - bytesMaterialized
                  - hits
                  - lastReadyMillis
                  - misses
                  - node
                  - refetched
                  - requests
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - node
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is Pending, Ready, or Failed.
                type: string
              rootID:
                description: RootID is the C4 ID of the resolved description (the
                  snapshot ID).
                type: string
              sourceID:
                description: |-
                  SourceID identifies the exact source resolved: the c4m text's ID for
                  a ConfigMap, or spec.source.id.
                type: string
              uniqueBytes:
                format: int64
                type: integer
              uniqueObjects:
                description: UniqueObjects and UniqueBytes are what a cold node fetches.
                format: int64
                type: integer
              viewID:
                description: |-
                  ViewID is the content-level C4 ID of the tree pods receive, after
                  the include filter. Scanning a pod's mount in c4 content mode gives
                  this ID.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
