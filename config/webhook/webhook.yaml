apiVersion: v1
kind: Service
metadata:
  name: c4-operator-webhook
spec:
  selector:
    app.kubernetes.io/name: c4-operator
    app.kubernetes.io/component: manager
  ports:
  - port: 443
    targetPort: 9443
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: c4-operator
webhooks:
- name: pods.c4.avalanche.io
  admissionReviewVersions: [v1]
  sideEffects: None
  # Only pods that ask for a materialization reach the webhook, so
  # failing closed cannot block unrelated pods. The webhook only adds a csi
  # volume; writing that volume into the pod spec needs no webhook.
  failurePolicy: Fail
  matchConditions:
  - name: requests-materialization
    expression: "has(object.metadata.annotations) && 'c4.avalanche.io/materialize' in object.metadata.annotations"
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values: [kube-system, c4-system]
  rules:
  - operations: [CREATE]
    apiGroups: [""]
    apiVersions: [v1]
    resources: [pods]
  clientConfig:
    # caBundle is written by the manager at startup.
    service:
      name: c4-operator-webhook
      namespace: c4-system
      path: /mutate-pod
- name: workjobs.c4.avalanche.io
  admissionReviewVersions: [v1]
  sideEffects: None
  # Every new WorkJob is stamped with the user who created it. WorkJobs
  # need the manager to run at all, so failing closed blocks nothing that
  # could otherwise proceed.
  failurePolicy: Fail
  rules:
  - operations: [CREATE]
    apiGroups: [c4.avalanche.io]
    apiVersions: [v1alpha1]
    resources: [workjobs]
  clientConfig:
    service:
      name: c4-operator-webhook
      namespace: c4-system
      path: /mutate-workjob
- name: agentbundles.c4.avalanche.io
  admissionReviewVersions: [v1]
  sideEffects: None
  # A bundle is stamped as a job is: the manager copies its owner to the
  # member jobs it makes, and host runners and owner-only pools read it.
  failurePolicy: Fail
  rules:
  - operations: [CREATE]
    apiGroups: [c4.avalanche.io]
    apiVersions: [v1alpha1]
    resources: [agentbundles]
  clientConfig:
    service:
      name: c4-operator-webhook
      namespace: c4-system
      path: /mutate-agentbundle
