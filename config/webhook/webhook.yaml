apiVersion: v1
kind: Service
metadata:
  name: c4-operator-webhook
spec:
  selector:
    app.kubernetes.io/name: c4-operator
    app.kubernetes.io/component: manager
  ports:
  - port: 443
    targetPort: 9443
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: c4-operator
webhooks:
- name: pods.c4.avalanche.io
  admissionReviewVersions: [v1]
  sideEffects: None
  # Only pods that ask for a materialization reach the webhook, so
  # failing closed cannot block unrelated pods.
  failurePolicy: Fail
  matchConditions:
  - name: requests-materialization
    expression: "has(object.metadata.annotations) && 'c4.avalanche.io/materialize' in object.metadata.annotations"
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values: [kube-system, c4-system]
  rules:
  - operations: [CREATE]
    apiGroups: [""]
    apiVersions: [v1]
    resources: [pods]
  clientConfig:
    # caBundle is written by the manager at startup.
    service:
      name: c4-operator-webhook
      namespace: c4-system
      path: /mutate-pod
