# A WorkJob's owner is set once, when it is created (by the
# /mutate-workjob webhook from the requesting user, or by the manager for
# jobs it creates for HUD and MCP users and for bundles), and never
# changes: the HUD's "My shots", the book, the job's signed record, pools
# with owners and host runners all read it. An AgentBundle's owner
# (/mutate-agentbundle) is fixed the same way, since its member jobs carry
# it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: c4-workjob-owner
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [c4.avalanche.io]
      apiVersions: [v1alpha1]
      operations: [UPDATE]
      resources: [workjobs, agentbundles, credentialleases]
  variables:
  - name: before
    expression: "has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
  - name: after
    expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
  validations:
  - expression: >-
      ['c4.avalanche.io/owner', 'c4.avalanche.io/submitted-via', 'c4.avalanche.io/grant', 'c4.avalanche.io/submitted-by-unit'].all(k,
        !(k in variables.before) || (k in variables.after && variables.after[k] == variables.before[k]))
    message: a WorkJob's or AgentBundle's owner, how it was submitted, the grant it was submitted under and the unit that submitted it are set at creation and cannot change
  - expression: "!('c4.avalanche.io/submitted-by-unit' in variables.after) || 'c4.avalanche.io/submitted-by-unit' in variables.before"
    message: only the farm says a unit submitted a job, when it creates it
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: c4-workjob-owner
spec:
  policyName: c4-workjob-owner
  validationActions: [Deny]
