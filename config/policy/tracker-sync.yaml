# A Tracker's sync (spec.sync) names the service account that relays its
# decisions: while a Tracker names it, the farm's certificate issuer
# certifies that account to sign relayed decisions for the Tracker
# (docs/c4-sync.md, PEOPLE-KEYS-2 6.1). So naming it hands an account a
# signing identity, and only the manager or a cluster admin (at install,
# c4 farm up --tracker) may set, change or clear it; anyone else who may
# edit a Tracker leaves it as it is. The account is in the Tracker's own
# namespace or the farm's (c4-system), never in another project's.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: c4-tracker-sync
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [c4.avalanche.io]
      apiVersions: ["*"]
      operations: [CREATE, UPDATE]
      resources: [trackers]
  matchConditions:
  - name: sync-set-or-changed
    expression: >-
      request.operation == 'CREATE' ? has(object.spec.sync) :
      (has(object.spec.sync) != has(oldObject.spec.sync) ||
       (has(object.spec.sync) && object.spec.sync != oldObject.spec.sync))
  validations:
  - expression: >-
      request.userInfo.username == 'system:serviceaccount:c4-system:c4-manager' ||
      'system:masters' in request.userInfo.groups
    message: a Tracker's sync is named at install or by the farm's manager, since it gives that account a relay's signing certificate
  - expression: >-
      !has(object.spec.sync) ||
      object.spec.sync.namespace == object.metadata.namespace ||
      object.spec.sync.namespace == 'c4-system'
    message: a Tracker's sync is an account in the Tracker's own namespace or the farm's (c4-system)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: c4-tracker-sync
spec:
  policyName: c4-tracker-sync
  validationActions: [Deny]
