# The controls people and agents give a running job (requeue, allow
# nodes, acknowledge, decide, steer, supply or withdraw a unit's question,
# accept a validated input, add units to a graph job, plan or close a
# lead's job) are annotations on the WorkJob that the queue carries out
# with the actor they name. Only the manager's account writes them: the
# HUD (and MCP, through it) checks who may give each control, signs it and
# books it, so it is the one place a control enters the farm. Anyone else
# with patch on a WorkJob could otherwise decide a person's wait as any
# actor, unsigned.
# The list of a job's control records is the HUD's too: no one else may
# add a record to it, or drop one. So is the record of the submission that
# made a job (c4.avalanche.io/submission-record), which a lead's workers'
# signed records name as the act that added them.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: c4-workjob-controls
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [c4.avalanche.io]
      apiVersions: [v1alpha1]
      operations: [CREATE, UPDATE]
      resources: [workjobs]
  matchConditions:
  - name: not-the-manager
    expression: "request.userInfo.username != 'system:serviceaccount:c4-system:c4-manager'"
  variables:
  - name: before
    expression: "request.operation == 'CREATE' || !has(oldObject.metadata.annotations) ? {} : oldObject.metadata.annotations"
  - name: after
    expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
  - name: controls
    expression: >-
      ['c4.avalanche.io/requeue', 'c4.avalanche.io/allow-nodes', 'c4.avalanche.io/acks',
       'c4.avalanche.io/decide', 'c4.avalanche.io/steer', 'c4.avalanche.io/supply',
       'c4.avalanche.io/accept-validated', 'c4.avalanche.io/withdraw-needs', 'c4.avalanche.io/append',
       'c4.avalanche.io/plan', 'c4.avalanche.io/close', 'c4.avalanche.io/control-records', 'c4.avalanche.io/submission-record']
  - name: labelsBefore
    expression: "request.operation == 'CREATE' || !has(oldObject.metadata.labels) ? {} : oldObject.metadata.labels"
  - name: labelsAfter
    expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
  validations:
  # A tool's publish test is its publisher's: the HUD hides its failures
  # from the project and refuses its controls by this label, so only the
  # HUD, which makes those jobs, may set it, and no one may move it.
  - expression: >-
      ('c4.avalanche.io/tool-test' in variables.labelsBefore) == ('c4.avalanche.io/tool-test' in variables.labelsAfter) &&
      (!('c4.avalanche.io/tool-test' in variables.labelsAfter) ||
        variables.labelsBefore['c4.avalanche.io/tool-test'] == variables.labelsAfter['c4.avalanche.io/tool-test'])
    message: "only the HUD marks a job a tool's publish test (c4.avalanche.io/tool-test): publish the tool, and the HUD makes its test"
  - expression: >-
      variables.controls.all(k,
        (k in variables.before) == (k in variables.after) &&
        (!(k in variables.after) || variables.before[k] == variables.after[k]))
    messageExpression: >-
      'only the HUD gives a job controls (' + variables.controls.filter(k,
        (k in variables.before) != (k in variables.after) ||
        ((k in variables.after) && variables.before[k] != variables.after[k])).join(', ') +
      '): use the HUD, c4 farm or MCP, which check who may and sign it'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: c4-workjob-controls
spec:
  policyName: c4-workjob-controls
  validationActions: [Deny]
