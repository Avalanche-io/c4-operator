# The farm's telemetry setting (the ConfigMap c4-telemetry-setting in c4-system)
# says how much telemetry the farm keeps (DESIGN.md section 6.9). Only the
# manager writes it, from the farm admin's signed control in the HUD
# (internal/hud/server/telemetry.go), so nobody with ConfigMap access in
# the namespace can raise the tier around the custody rule.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: c4-telemetry-setting
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: c4-system
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE, DELETE]
      resources: [configmaps]
  matchConditions:
  - name: is-the-setting
    expression: "(request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name) == 'c4-telemetry-setting'"
  validations:
  - expression: "request.userInfo.username == 'system:serviceaccount:c4-system:c4-manager'"
    message: the farm's telemetry setting is changed by the farm admin in the HUD (or c4 farm telemetry), never written directly
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: c4-telemetry-setting
spec:
  policyName: c4-telemetry-setting
  validationActions: [Deny]
